/div></div><div class="toolbar"><input type="month" id="month"><span id="syncBadge" class="muted">未连接同步服务</span><button id="syncButton" onclick="syncNow()">立即同步</button><button type="button" onclick="openHeaderMenu(event)" aria-label="窗口与备份操作">更多</button><button onclick="page=6;render()">备份与设置</button></div></header><div id="content"></div></main><div id="actionMenu" class="floating-menu" hidden role="menu" aria-label="更多操作"></div><dialog id="modal"><form id="form"><h3 id="formTitle"></h3><div id="fields"></div><div class="dialog-actions"><button type="button" onclick="modal.close()">取消</button><button type="submit" id="modalSubmit" class="primary">保存</button></div></form></dialog><dialog id="syncModal"><h3 id="syncHeading">正在同步</h3><div id="syncMessage"></div><div id="syncActions" class="toolbar" style="margin-top:18px"></div></dialog><input id="restore" type="file" accept="application/json" hidden><script>const APP_VERSION="3.3.7";
function settingsWorkspace(){

    [BEFORE_UPDATE,'2.5','exportBeforeUpdate'],
    [KEY+'-before-v271','2.7.1','exportBefore271'],
    [KEY+'-before-v272','2.7.2','exportBefore272'],
    [KEY+'-before-v280','2.8','exportBefore280']

  const history=backups.length?`<details class="settings-details"><summary>历史备份</summary>
    <div class="toolbar">${backups.map(([,version,handler])=>`<button type="button" onclick="${handler}()">导出 v${version} 更新前备份</button>`).join('')}</div>
  </details>`:'';
  return `<div class="settings-sheet">
    ${updatePanel()}
    <section class="settings-section settings-row" aria-labelledby="settingsPayments">
      <div><h3 id="settingsPayments">付款截图</h3><p class="muted">本机识别付款截图，核对后记账。</p></div>
      <button type="button" data-payment-inbox onclick="openPaymentInbox()">截图记账</button>
    </section>
    <section class="settings-section" aria-labelledby="settingsLedger">
      <h3 id="settingsLedger">账本</h3>
      <div class="settings-plan">
        <label>计划起始月份<input id="baseInput" type="month" value="${data.base}"></label>
        <label>起始月份月初可用余额（元）<input id="balanceInput" type="number" step="0.01" value="${data.balance}"></label>
        <button type="button" class="primary" onclick="setPlan()">保存设置</button>
      </div>
      <div class="settings-backups toolbar">
        <button type="button" onclick="backup()">导出 JSON 备份</button>
        <button type="button" onclick="restore.click()">从备份恢复</button>
      </div>
      ${history}
    </section>
    <section class="settings-section" aria-labelledby="settingsSync">
      <div class="settings-row">
        <div><h3 id="settingsSync">坚果云同步</h3><p class="muted" id="settingsSyncStatus"></p></div>
        <button type="button" onclick="syncNow()">立即同步</button>
      </div>
      <label class="settings-checkbox"><input type="checkbox" id="autoSync" onchange="localStorage.setItem('yuliang-auto-sync',this.checked)"> 开启自动同步</label>
      <details class="settings-details">
        <summary>连接设置</summary>
        <div class="settings-connection">
          <label class="settings-address">WebDAV 地址<input id="davServer" type="url" value="https://dav.jianguoyun.com/dav/"></label>
          <label>坚果云账号<input id="davUser" autocomplete="off"></label>
          <label>应用密码<input id="davPassword" type="password" autocomplete="new-password"></label>
        </div>
        <div class="toolbar">
          <button type="button" class="primary" onclick="saveSyncConfig()">保存配置</button>
          <button type="button" onclick="testSync()">测试连接</button>
          <button type="button" onclick="disconnectSync()">断开连接</button>
        </div>
        <p id="davFeedback" class="muted" role="status"></p>
        <p class="muted">手机和电脑使用同一坚果云账号及应用密码。自动同步在启动时、每 5 分钟及保存后约 30 秒触发。同步会上传整份账本，内容未做端到端加密；遇到冲突时需手动选择版本。</p>
      </details>
    </section>
    <section class="settings-section settings-row" aria-labelledby="settingsNames">
      <div><h3 id="settingsNames">界面名称</h3><p class="muted">自定义本机显示的标题和统计卡名称。</p></div>
      <button type="button" onclick="openDisplayNames()">编辑名称</button>

}

function renderSettings(){
  renderUpdateStatus();
  const badge=document.getElementById('syncBadge');
  document.getElementById('settingsSyncStatus').textContent=badge.textContent;
  loadSyncConfig();
  loadCloseBehavior();
}

let savedCloseBehavior='tray';
let closeBehaviorSaving=false;

function showCloseBehavior(enabled,message=''){
  for(const input of document.querySelectorAll('input[name="closeBehavior"]')){
    input.checked=input.value===savedCloseBehavior;
    input.disabled=!enabled;
  }
  const status=document.getElementById('closeBehaviorStatus');
  if(status){
    status.textContent=message;
    status.hidden=!message;
  }
}

async function loadCloseBehavior(){
  if(!window.NATIVE_SYNC||closeBehaviorSaving)return;
  try{
    const result=await nativeCall('/settings/close');
    if(closeBehaviorSaving)return;
    savedCloseBehavior=result.mode;
    showCloseBehavior(true);
  }catch(error){
    showCloseBehavior(false,'无法读取关闭窗口设置。'+error.message);
  }
}

async function saveCloseBehavior(mode){
  if(closeBehaviorSaving)return;
  closeBehaviorSaving=true;
  for(const input of document.querySelectorAll('input[name="closeBehavior"]'))input.disabled=true;
  let message='';
  try{
    const result=await nativeCall('/settings/close',{mode});
    savedCloseBehavior=result.mode;
  }catch(error){
    message='保存失败。'+error.message;
  }finally{
    closeBehaviorSaving=false;
    showCloseBehavior(true,message);
  }
}

const updateState={status:'idle',version:'',notes:'',message:'',package:{status:'idle'}};
let updatePoll=null;

function updatePanel(){
  return `<section class="settings-section" aria-labelledby="settingsUpdate">
    <div class="settings-row">
      <div><h3 id="settingsUpdate">软件更新</h3><p class="muted">当前版本 v${APP_VERSION}</p></div>
      <button type="button" id="checkUpdatesButton" onclick="checkForUpdates()">检查更新</button>
    </div>
    <p id="updateStatus" class="muted" role="status" hidden></p>
    <p id="updateNotes" class="update-notes" hidden></p>
    <progress id="updateProgress" max="100" aria-label="安装包下载进度" hidden></progress>
    <p id="updateDownloadStatus" class="muted" role="status" hidden></p>
    <div class="toolbar">
      <button type="button" class="primary" id="downloadUpdateButton" onclick="downloadUpdate()" hidden>下载并安装</button>
      <button type="button" class="primary" id="installUpdateButton" onclick="installUpdate()" hidden>打开系统安装器</button>
      <button type="button" id="openReleaseButton" onclick="openUpdateRelease()" hidden>打开发布页</button>
    </div>
  </section>`;
}

function renderUpdateStatus(){
  const check=document.getElementById('checkUpdatesButton');
  if(!check)return;
  const {status,version,notes,message,package:pkg}=updateState;
  const messages={
    checking:'正在检查更新…',
    current:'已是最新版。',
    available:`发现新版本 v${version}。`,
    missing:`发现新版本 v${version}，但该版本没有可用的 Android APK。`,
    no_release:'GitHub 上暂无可用发布版。',
    network_failed:`网络连接失败。${message}`,
    rate_limited:`GitHub 请求已限流。${message}`,
    invalid:`发布信息无效。${message}`,
    unverified:`发现新版本 v${version}，但 Android APK 缺少有效的校验信息。`,
    failed:`检查失败。${message}`
  };
  check.disabled=status==='checking'||['downloading','installing'].includes(pkg.status);
  const statusElement=document.getElementById('updateStatus');
  statusElement.textContent=messages[status]||'';
  statusElement.hidden=status==='idle';
  const notesElement=document.getElementById('updateNotes');
  notesElement.textContent=notes.trim()||'此版本未提供更新说明。';
  notesElement.hidden=!['available','missing','unverified'].includes(status);
  const progress=document.getElementById('updateProgress');
  const percent=pkg.total?Math.min(100,Math.floor(pkg.received*100/pkg.total)):0;
  progress.value=percent;
  progress.hidden=pkg.status!=='downloading';
  const downloadStatus=document.getElementById('updateDownloadStatus');
  const messagesByPhase={
    downloading:percent===100?'正在校验安装包…':`正在下载… ${percent}%`,
    ready:pkg.message||'安装包已校验，可以重启安装。',
    installing:'正在重启并安装…',
    failed:pkg.message
  };
  downloadStatus.textContent=messagesByPhase[pkg.status]||'';
  downloadStatus.hidden=!downloadStatus.textContent;
  const download=document.getElementById('downloadUpdateButton');
  download.hidden=status!=='available'||!['idle','failed'].includes(pkg.status);
  download.textContent=pkg.status==='failed'?'重新下载':'下载并安装';
  document.getElementById('installUpdateButton').hidden=status!=='available'||pkg.status!=='ready';
  document.getElementById('openReleaseButton').hidden=(!window.NATIVE_SYNC&&!window.AndroidSync)||
    (!['failed','missing','unverified','no_release','network_failed','rate_limited','invalid'].includes(status)&&pkg.status!=='failed');
}

async function openUpdateRelease(){
  try{
    await nativeCall('/updates/open-release',{});
  }catch(error){
    const status=document.getElementById('updateDownloadStatus');
    if(status){status.textContent='无法打开发布页。'+error.message;status.hidden=false;}
  }
}

async function checkForUpdates(){
  if(updateState.status==='checking')return;
  Object.assign(updateState,{status:'checking',version:'',notes:'',message:'',package:{status:'idle'}});
  renderUpdateStatus();
  try{
    if(!window.NATIVE_SYNC&&!window.AndroidSync)throw Error('请安装余量 Android 版后检查更新。');
    Object.assign(updateState,await nativeCall('/updates/check'));
  }catch(error){
    Object.assign(updateState,{status:'failed',message:error.message});
  }
  renderUpdateStatus();
  pollUpdateDownload();
}

async function downloadUpdate(){
  if(updateState.status!=='available')return;
  updateState.package={status:'downloading'};
  renderUpdateStatus();
  try{
    updateState.package=await nativeCall('/updates/download',{version:updateState.version});
  }catch(failure){
    updateState.package={status:'failed',message:failure.message};
  }
  renderUpdateStatus();
  pollUpdateDownload();
}

function pollUpdateDownload(){
  if(updatePoll!==null||updateState.package.status!=='downloading')return;
  updatePoll=setTimeout(async()=>{
    try{
      const result=await nativeCall('/updates/progress');
      if(result.version!==updateState.version)throw Error('另一窗口正在下载其他版本，请稍后重新检查。');
      updateState.package=result;
    }catch(error){
      updateState.package={status:'failed',message:error.message};
    }
    updatePoll=null;
    renderUpdateStatus();
    pollUpdateDownload();
  },300);
}

async function installUpdate(){
  if(updateState.package.status!=='ready')return;
  updateState.package={status:'installing'};
  renderUpdateStatus();
  try{
    const result=await nativeCall('/updates/install',{version:updateState.version});
    if(result.package)updateState.package=result.package;
    renderUpdateStatus();
  }catch(error){
    updateState.package={status:'ready',message:error.message};
    renderUpdateStatus();
  }
}

function screenshotCategory(source){
  const name=source.replace(/\s/g,'');
  return spendingAliases.get(name)||Object.keys(expenseCategories).find(key=>expenseCategories[key].label===name)||'';
}

function screenshotLines(words){
  const bands=[];
  const heights=words.map(word=>word.h).sort((a,b)=>a-b);
  const minHeight=(heights[Math.floor(heights.length/2)]||0)*.4;
  const ordered=words.map(word=>({...word,text:word.text.normalize('NFKC')})).sort((a,b)=>a.y+a.h/2-b.y-b.h/2);
  const punctuation=word=>word.h<minHeight&&/^[·.,，。−–一-]$/.test(word.text);
  for(const word of ordered.filter(word=>!punctuation(word))){
    const center=word.y+word.h/2;
    const last=bands.at(-1);
    if(last&&Math.abs(last.center-center)<=Math.max(4,Math.min(last.height,word.h)*.45)){
      last.words.push(word);
      last.height=Math.max(last.height,word.h);
    }else bands.push({center,height:word.h,words:[word]});
  }
  for(const word of ordered.filter(punctuation)){
    const center=word.y+word.h/2;
    const nearest=bands.reduce((best,band)=>!best||Math.abs(band.center-center)<Math.abs(best.center-center)?band:best,null);
    if(nearest&&Math.abs(nearest.center-center)<=nearest.height*.65)
      nearest.words.push(word.text==='一'?{...word,text:'-'}:word);
  }
  return bands.map(band=>band.words.sort((a,b)=>a.x-b.x).map(word=>word.text).join(' ')
    .replace(/(\d)\s*[.·。]\s*(?=\d)/g,'$1.')
    .replace(/(\d)\s*[,，]\s*(?=\d)/g,'$1,'));
}

function screenshotMoney(raw){
  const value=raw.normalize('NFKC').trim().replace(/^(?:[−–-]\s*[¥￥]?|[¥￥]\s*[−–-]?)\s*/,'');
  if(!/^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?$/.test(value))return null;
  const centsValue=readSpendingAmountCents(value.replace(/,/g,''));
  return Number.isSafeInteger(centsValue)&&centsValue>=0&&centsValue<=consumptionMoneyLimit*100?centsValue:null;
}

function parseSpendingScreenshot(lines){
  const rows=[],dates=new Set();
  let total='',unparsed=0;
  const unlabelledTotals=[];
  const amountToken='(?:[−–-]\\s*[¥￥]?|[¥￥]\\s*[−–-]?)?\\s*[0-9OoIl?][0-9.,OoIl?]*';
  const amounts=line=>[...line.matchAll(new RegExp(amountToken,'g'))].map(match=>match[0].trim());
  const normalized=lines.map(line=>line.normalize('NFKC').trim()).filter(Boolean);
  for(let i=0;i<normalized.length;i++){
    const line=normalized[i].replace(/^\d+\s+(?=\p{Script=Han})/u,'');
    const foundDates=[...line.matchAll(/(20\d{2})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})(?:日)?/g)];
    for(const [,y,m,d] of foundDates){
      const date=y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0');
      if(validDate(date))dates.add(date);
    }
    if(foundDates.length)continue;
    if(/^(?:本月|本期|共)?(?:总支出|支出总额|支出合计|合计支出|总花费|支出(?:金额)?)(?:\s|[:：(（¥￥\d]|$)/.test(line.replace(/(?<=\p{Script=Han})\s+(?=\p{Script=Han})/gu,''))){
      const value=amounts(line).at(-1);
      const next=normalized[i+1]?.trim()||'';
      if(value)total=value;
      else if(screenshotMoney(next)!==null){total=next;i++;}
      continue;
    }
    if(!rows.length&&/^[¥￥]/.test(line)&&screenshotMoney(line)!==null){
      unlabelledTotals.push(line);
      continue;
    }
    const count=line.match(/(\d+)\s*笔/)?.[1]||'';
    if(line.includes('%')&&!/[¥￥−–-]/.test(line)&&!count)continue;
    const clean=line.replace(/\d+(?:[.,]\d+)?\s*%/g,'').replace(/\d+\s*笔/g,'').trim();
    const head=clean.match(/^[\p{Script=Han}][\p{Script=Han}\s·、/／&和]*(?=\s|[¥￥\d−–-]|$)/u)?.[0]?.trim();
    if(!head)continue;
    const source=head.replace(/\s+/g,'');
    if(/^(?:分类统计|支出统计|分类|排名|占比|账单|支出|收入|明细)$/.test(source))continue;
    let candidates=amounts(clean.slice(head.length));
    if(!candidates.length&&(count||screenshotCategory(source))){
      const next=(normalized[i+1]||'').replace(/^一\s*(?=\d)/,'-');
      if(screenshotMoney(next)!==null){candidates=[next];i++;}
    }
    if(!candidates.length&&!count&&(!screenshotCategory(source)||line.includes('%')))continue;
    if(!count&&!/[¥￥−–-]/.test(line)&&candidates.length>1&&candidates.every(value=>!value.includes('.')))continue;
    if(rows.length>=100){unparsed++;continue;}
    rows.push({source,amount:candidates.at(-1)||'',count,category:screenshotCategory(source),uncertain:candidates.length!==1});
  }
  return {rows,total:total||(unlabelledTotals.length===1?unlabelledTotals[0]:''),dates:[...dates].sort(),unparsed};
}

function screenshotSummaryEntries(rows,channel,account){
  if(!rows.length)throw Error('请至少保留一条分类。');
  const grouped=new Map();
  for(const row of rows){
    const amount=screenshotMoney(row.amount);
    if(!row.source.trim()||!row.category||amount===null||row.uncertain)
      throw Error('请补齐原分类、金额和归类，并核对标出的识别金额。');
    const group=grouped.get(row.category)||{sources:new Set(),amount:0};
    group.sources.add(row.source.trim());
    group.amount+=amount;
    if(group.amount>consumptionMoneyLimit*100)throw Error('同一分类的合计金额超出范围。');
    grouped.set(row.category,group);
  }
  return [...grouped].map(([category,group])=>({
    channel,source:[...group.sources].join('、'),category,amount:group.amount/100,...(account?{wechatAccount:account}:{})
  }));
}

function planScreenshotImport(ledger,target,items,channel,account){
  const {month,kind,from,through}=target;
  if(!validDate(from)||!validDate(through)||from>through||from.slice(0,7)!==month||through.slice(0,7)!==month)
    throw Error('请选择同一个月份内的有效起止日期。');
  if(kind==='mid'&&(from!==month+'-01'||through===monthEnd(month)))
    throw Error('月中区间须从 1 日开始，并在月末之前结束。');
  const matches=item=>item.channel===channel&&(channel!=='wechat'||!account||(item.wechatAccount||'')===account);
  const saved=spendingSummaryFor(month,kind,ledger);
  const adjacent=spendingSummaryFor(month,kind==='mid'?'end':'mid',ledger);
  const otherItems=(saved?.items||[]).filter(item=>!matches(item));
  const rangeChanged=!!saved&&(saved.from!==from||saved.through!==through);
  const overlap=adjacent&&(kind==='mid'?adjacent.from<=through:adjacent.through>=from);
  if(channel==='wechat'&&account&&[...(saved?.items||[]),...(overlap?adjacent.items:[])].some(item=>item.channel==='wechat'&&!item.wechatAccount))
    throw Error('相关区间已有未分账号的微信数据。请先在分类花费中明确原数据的账号，再导入分账号截图。');
  if(rangeChanged&&otherItems.length)
    throw Error('目标盘点区间为 '+saved.from+' 至 '+saved.through+'，其中有其他渠道。请对齐原区间，或先在分类花费里调整原记录。');
  if(overlap&&adjacent.items.some(item=>!matches(item)))
    throw Error('日期与 '+adjacent.from+' 至 '+adjacent.through+' 重叠，且该区间含其他渠道。请修改导入日期，或先整理原区间。');
  const replace=!!saved&&saved.items.some(matches);
  const conflicts=[];
  if(replace)conflicts.push('替换目标区间 '+saved.from+' 至 '+saved.through+' 的 '+saved.items.filter(matches).length+' 条分类。');
  if(overlap)conflicts.push('移除冲突区间 '+adjacent.from+' 至 '+adjacent.through+' 的 '+adjacent.items.length+' 条分类及其拆分。');
  const updated={...target,items:otherItems.concat(items)};
  return {updated,saved,overlap:overlap?adjacent:null,rangeChanged,conflicts};
}

function applyScreenshotImport(ledger,plan){
  const {updated,saved,overlap,rangeChanged}=plan;
  const removed=new Set([saved,overlap]);
  ledger.spendingSummaries=(ledger.spendingSummaries||[]).filter(item=>!removed.has(item)).concat(updated);
  if(overlap)writeSpendingSplit(ledger,overlap,{});
  writeSpendingSplit(ledger,updated,saved&&!rangeChanged?spendingSplitsWithinTotals(updated,spendingSplitFor(saved,ledger)):{});
}

async function screenshotImageData(file){
  if(!file||!/^image\/(png|jpeg|webp|bmp)$/.test(file.type)||file.size>16*1024*1024)
    throw Error('请选择小于 16 MB 的 PNG、JPEG、WebP 或 BMP 截图。');
  const image=await createImageBitmap(file);
  try{
    if(file.type==='image/jpeg'&&file.size<=2.5*1024*1024&&Math.max(image.width,image.height)<=2400){
      return await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result.split(',')[1]);
        reader.onerror=()=>reject(Error('无法读取截图文件。'));
        reader.readAsDataURL(file);
      });
    }
    const ratio=Math.min(1,2400/Math.max(image.width,image.height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.width*ratio));
    canvas.height=Math.max(1,Math.round(image.height*ratio));
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',.9).split(',')[1];
  }finally{image.close();}
}

function openSpendingScreenshotImport(kind='month',chartMode='total'){
  const snapshot=JSON.stringify(data);
  modal.classList.add('wide-dialog');
  formTitle.textContent='截图导入分类花费';
  const saveButton=document.getElementById('modalSubmit');
  saveButton.textContent='确认导入';
  fields.innerHTML=`<div class="screenshot-import">
    <div class="toolbar"><label>分类统计截图<input id="screenshotFile" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"></label>

    <div class="screenshot-target">
      <label>支付渠道<select id="screenshotChannel" required><option value="">请选择</option>

      <label>开始日期<input id="screenshotFrom" type="date" required></label>
      <label>结束日期<input id="screenshotThrough" type="date" required></label>
    </div>
    <div class="toolbar"><label>截图支出总额（可选）<input id="screenshotTotal" inputmode="decimal"></label>
      <button type="button" id="screenshotAdd">添加一行</button></div>
    <div id="screenshotRows"></div><p id="screenshotReview" class="muted" role="status"></p>
    <label class="check-label"><input id="screenshotConfirmed" type="checkbox" required> 已核对截图、金额和归类</label>
    <div id="screenshotConflict" class="notice" role="status" hidden></div>
    <label class="check-label" id="screenshotReplaceLabel" hidden><input id="screenshotReplace" type="checkbox"> 确认按上方提示替换，保留其他渠道</label>
  </div>`;
  const get=id=>document.getElementById(id);
  const status=get('screenshotStatus'),rowsHost=get('screenshotRows'),file=get('screenshotFile');
  const channel=get('screenshotChannel'),slot=get('screenshotKind'),from=get('screenshotFrom'),through=get('screenshotThrough');
  const confirmed=get('screenshotConfirmed'),replace=get('screenshotReplace'),conflict=get('screenshotConflict');
  const review=get('screenshotReview'),total=get('screenshotTotal');
  const options=[['','请选择'],...Object.entries(expenseCategories).map(([key,value])=>[key,value.label]),['transfer','非消费转出']];
  let rows=[],busy=false,request=0;
  slot.value=kind==='end'?'end':'mid';

  function plan(ledger=data){
    if(!channel.value||!from.value||!through.value)throw Error('请选择支付渠道并补齐起止日期。');
    const [code,account='']=channel.value.split(':');
    return planScreenshotImport(ledger,{month:through.value.slice(0,7),kind:slot.value,from:from.value,through:through.value},
      screenshotSummaryEntries(rows,code,account),code,account);
  }
  function refresh(){
    const values=rows.map(row=>screenshotMoney(row.amount));
    const sum=values.reduce((amount,n)=>amount+(n??0),0);
    const expected=screenshotMoney(total.value);
    const warning=total.value&&(expected===null?'截图总额待核对':expected!==sum?'与截图总额相差 '+money(Math.abs(expected-sum)/100):'与截图总额一致');
    review.textContent='分类合计 '+money(sum/100)+(warning?' · '+warning:'');
    review.classList.toggle('negative',!!total.value&&expected!==sum);
    let pending,error='';
    try{pending=plan();}catch(failure){error=failure.message;}
    conflict.textContent=pending?.conflicts.join(' ')||error;
    conflict.hidden=!conflict.textContent;
    get('screenshotReplaceLabel').hidden=!pending?.conflicts.length;
    saveButton.disabled=busy||!confirmed.checked||!pending||(pending.conflicts.length>0&&!replace.checked);
  }
  function changed(){
    confirmed.checked=false;
    replace.checked=false;
    refresh();
  }
  function draw(){
    rowsHost.innerHTML=table(['原分类','识别金额（元）','笔数','余量分类','操作'],rows.map((entry,index)=>row([
      `<input data-input="source" aria-label="第 ${index+1} 行原分类" value="${esc(entry.source)}">`,
      `<input data-input="amount" aria-label="第 ${index+1} 行金额" inputmode="decimal" value="${esc(entry.amount)}"><small data-amount-warning></small>`,
      esc(entry.count||'—'),
      `<select data-input="category" aria-label="第 ${index+1} 行余量分类">${options.map(([key,label])=>
        `<option value="${key}" ${key===entry.category?'selected':''}>${label}</option>`).join('')}</select><small data-category-warning></small>`,
      `<button type="button" data-remove-row aria-label="删除第 ${index+1} 行">删除</button>`
    ])));
    rowsHost.querySelectorAll('tr:has([data-input])').forEach((element,index)=>{
      const entry=rows[index],category=element.querySelector('[data-input="category"]');
      const amount=element.querySelector('[data-input="amount"]');
      function mark(){
        const bad=entry.uncertain||screenshotMoney(entry.amount)===null;
        element.querySelector('[data-amount-warning]').textContent=bad?'金额待核对':'';
        element.querySelector('[data-category-warning]').textContent=entry.category?'':'分类未匹配';
        amount.setAttribute('aria-invalid',String(bad));
        category.setAttribute('aria-invalid',String(!entry.category));
      }
      element.oninput=event=>{
        const key=event.target.dataset.input;
        if(!key)return;
        entry[key]=event.target.value;
        if(key==='source'){entry.category=screenshotCategory(entry.source);category.value=entry.category;}
        if(key==='amount')entry.uncertain=false;
        mark();changed();
      };
      element.querySelector('[data-remove-row]').onclick=()=>{rows.splice(index,1);draw();changed();};
      mark();
    });
    refresh();
  }
  get('screenshotAdd').onclick=()=>{rows.push({source:'',amount:'',count:'',category:'',uncertain:false});draw();changed();};
  get('returnToScreenshotSummary').onclick=()=>{saveButton.disabled=false;openSpendingSummary(kind,chartMode);};
  for(const input of [channel,slot,from,through,total])input.oninput=changed;
  confirmed.onchange=replace.onchange=refresh;
  file.onchange=async()=>{
    if(!file.files.length)return;
    const attempt=++request;
    busy=true;status.textContent='正在识别截图…';refresh();
    try{
      const image=await screenshotImageData(file.files[0]);
      const result=await nativeCall('/spending/ocr',{image});
      if(request!==attempt||!status.isConnected||!modal.open)return;
      const parsed=parseSpendingScreenshot(screenshotLines(result.words));
      rows=parsed.rows;
      total.value=parsed.total;
      from.value=parsed.dates.length===2?parsed.dates[0]:'';
      through.value=parsed.dates.length===2?parsed.dates[1]:'';
      status.textContent=rows.length?'识别到 '+rows.length+' 条分类，请与截图逐行核对。'+(parsed.unparsed?'有超出预览上限的条目，请裁切后重新识别。':''):'未识别到分类行，可换一张截图或添加行。';
      draw();
    }catch(error){
      if(request===attempt&&status.isConnected)status.textContent=error.message;
    }finally{
      if(request===attempt&&status.isConnected){file.value='';busy=false;changed();}
    }
  };
  form.onsubmit=event=>{
    event.preventDefault();
    try{
      ensureEditorFresh(snapshot);
      const next=structuredClone(data);
      const pending=plan(next);
      if(busy||!confirmed.checked||(pending.conflicts.length&&!replace.checked))return;
      applyScreenshotImport(next,pending);
      if(commitFinance(next)){
        month.value=pending.updated.month;
        render();
        saveButton.disabled=false;
        openSpendingSummary(pending.updated.kind,chartMode);
      }
    }catch(error){status.textContent=error.message;}
  };
  modal.addEventListener('close',()=>{saveButton.disabled=false;},{once:true});
  draw();
  if(!modal.open)modal.showModal();
}

let depositAccountsObserver;
function observeDepositAccounts(){
  depositAccountsObserver?.disconnect();
  const panel=content.querySelector('.deposit-accounts');
  if(!panel)return;
  const scroll=panel.querySelector('.table-scroll');
  const toggle=panel.querySelector('[data-deposit-expand]');
  if(!toggle||depositsExpanded)return;
  const rows=[...scroll.querySelectorAll('tbody tr')];
  const fit=()=>{
    const bottom=scroll.getBoundingClientRect().top+scroll.clientTop+scroll.clientHeight-scroll.scrollTop;
    let count=0;
    for(const row of rows){
      if(row.getBoundingClientRect().bottom>bottom+.5)break;
      count++;
    }
    rows.forEach((row,index)=>row.classList.toggle('deposit-row-overflow',index>=Math.max(1,count)));
    scroll.classList.toggle('deposit-first-row-overflow',count===0);
    toggle.hidden=count===rows.length;
  };
  fit();
  depositAccountsObserver=new ResizeObserver(fit);
  depositAccountsObserver.observe(scroll);
  depositAccountsObserver.observe(scroll.querySelector('table'));
}

// Presentation state lives in memory; category and balance totals come from existing reports.
const spendingAnalysisSelection=new Map();
const spendingAnalysisSlots=['mid','end','month'];

function spendingAnalysisView(m,scope,stats,summaries){
  const periods={
    mid:stats.first,
    end:stats.second||(!stats.record.mid&&stats.record.end?stats.latest:null),
    month:stats.full||stats.latest
  };
  const fromMonthStart=periods.end?.startDate===m+'-01'||summaries.some(s=>s.kind==='end'&&s.from===m+'-01');
  const labels={mid:'月初至月中',end:fromMonthStart?'月初至月末':'月中至月末',month:'整月'};
  const latestSlot=['mid','end'].map(kind=>{
    const recorded=summaries.find(s=>s.kind===kind)?.through||'';
    const counted=periods[kind]?.date||'';
    return {kind,date:recorded>counted?recorded:counted};
  }).filter(slot=>slot.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const key=m+'|'+scope,selection=spendingAnalysisSelection.get(key);
  const kind=selection?.kind||(stats.full?'month':latestSlot?.kind||'month');
  const selected=summaries.filter(s=>kind==='month'||s.kind===kind).sort((a,b)=>a.from.localeCompare(b.from));
  const {categories,total}=spendingBreakdown(selected);
  const {missing,necessary,adjustable}=spendingSplitTotals(categories,total);
  const splitReady=total!==null&&!missing;
  const mode=splitReady&&selection?.mode==='necessary'?'necessary':'total';
  return {key,kind,mode,labels,selected,categories,total,necessary,adjustable,missing,splitReady,
    period:periods[kind],latest:stats.latest,settled:!!stats.full,hasEnd:!!stats.record.end,pocket:scope==='pocket'};
}

function spendingAnalysisRange(from,through){
  return from.slice(5)+' 至 '+through.slice(5);
}

function spendingAnalysisPlot(view){
  const isNecessary=view.mode==='necessary',amount=isNecessary?view.necessary:view.total;
  const ranking=view.categories.map(item=>({
    ...item,amount:isNecessary&&item.amount!==null?item.amount-(item.adjustable??0):item.amount
  })).filter(item=>item.amount>0).sort((a,b)=>b.amount-a.amount);
  const formatted=money(amount/100);
  let offset=0;
  const slices=ranking.map(({key,label,amount:value})=>{
    const share=value/amount*100;
    const percent=share<0.05?'&lt;0.1%':Number(share.toFixed(1))+'%';
    const gap=ranking.length>1?Math.min(0.66,share*0.16):0;
    const arc=share-gap,color=spendingCategoryColors[key],start=offset+gap/2;
    offset+=share;
    return {key,label,value,percent,color,arc,start};
  });
  const rings=slices.map(({label,value,percent,color,arc,start})=>`<circle cx="100" cy="100" r="82" pathLength="100"
    stroke="${color}" stroke-dasharray="${arc} ${100-arc}" stroke-dashoffset="${-start}">
    <title>${esc(label)} · ${money(value/100)} · ${percent}</title></circle>`).join('');
  const rankingMarkup=slices.length?`<ol class="analysis-category-rank" aria-label="按金额排列的品类">
    ${slices.map(({key,label,value,percent,color})=>`<li data-category="${key}" data-amount="${value}" title="${esc(label)}">
      <i style="background:${color}" aria-hidden="true"></i><span>${esc(label)}</span><b>${money(value/100)}</b><small>${percent}</small>
    </li>`).join('')}
  </ol>`:`<p class="analysis-zero">${isNecessary?'该区间无必要开支':'该区间已录分类金额为零'}</p>`;
  return `<div class="analysis-distribution"><div class="analysis-ring">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="82" fill="none" stroke="#edf2ee" stroke-width="25"/>
      <g fill="none" stroke-width="25" transform="rotate(-90 100 100)">${rings}</g>
    </svg>
    <div class="analysis-ring-label"><span>${isNecessary?'必要合计':'分类合计'}</span>
      <strong class="analysis-total" data-amount="${amount}" style="--amount-font:${Math.min(21,199/formatted.length)}px">${formatted}</strong></div>
  </div>${rankingMarkup}</div>`;
}

      ${[['total','总支出'],['necessary','必要开支']].map(([mode,label])=>`<button type="button" data-analysis-chart-mode="${mode}"
        aria-pressed="${view.mode===mode}" class="${view.mode===mode?'selected':''}" onclick="setSpendingAnalysisMode('${mode}')"
        ${mode==='necessary'&&!view.splitReady?'disabled title="填齐可调开支后查看必要构成"':''}>${label}</button>`).join('')}
    </div>

let repaymentVisualMode='month';

function repaymentVisualState(ledger,m,mode='month'){
  const records=ledger.debts||[],monthRecords=records.filter(item=>item.date.startsWith(m));
  const scope=mode==='all'?records:monthRecords;
  const amountOf=item=>Math.round(Number(item.amount)*100);
  const totalOf=items=>items.reduce((total,item)=>total+amountOf(item),0);
  const due=totalOf(scope),paid=totalOf(scope.filter(item=>item.paid)),pending=totalOf(scope.filter(item=>!item.paid));
  const chartRecords=mode==='all'?records.filter(item=>!item.paid):monthRecords;
  const names=[...new Set(records.map(item=>String(item.name||'其他').trim()||'其他'))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
  const palette=['#19775e','#e0ad58','#638daf','#9874b0','#d97c63','#63a4a0','#a6ad62'];
  const grouped=new Map();
  for(const item of chartRecords){
    const name=String(item.name||'其他').trim()||'其他',amount=amountOf(item);
    if(amount>0)grouped.set(name,(grouped.get(name)||0)+amount);
  }
  const chartTotal=[...grouped.values()].reduce((a,b)=>a+b,0);
  const groups=[...grouped].map(([name,amount])=>({name,amount,color:palette[names.indexOf(name)%palette.length],share:chartTotal?amount/chartTotal:0}))
    .sort((a,b)=>b.amount-a.amount||a.name.localeCompare(b.name,'zh-CN'));
  return {mode:mode==='all'?'all':'month',month:m,due,paid,pending,chartTotal,groups};
}

function repaymentRingShare(share){return (share*100).toLocaleString('zh-CN',{maximumFractionDigits:1})+'%';}
function repaymentRingArc(cx,cy,outer,inner,start,end){
  const point=(radius,angle)=>[cx+Math.cos(angle)*radius,cy+Math.sin(angle)*radius].map(value=>value.toFixed(3)).join(' ');
  if(end-start>=Math.PI*2-.00001)return `M ${cx} ${cy-outer} A ${outer} ${outer} 0 1 1 ${cx} ${cy+outer} A ${outer} ${outer} 0 1 1 ${cx} ${cy-outer} M ${cx} ${cy-inner} A ${inner} ${inner} 0 1 0 ${cx} ${cy+inner} A ${inner} ${inner} 0 1 0 ${cx} ${cy-inner}`;
  const gap=Math.min(.022,(end-start)*.12),a=start+gap/2,b=end-gap/2,large=b-a>Math.PI?1:0;
  return `M ${point(outer,a)} A ${outer} ${outer} 0 ${large} 1 ${point(outer,b)} L ${point(inner,b)} A ${inner} ${inner} 0 ${large} 0 ${point(inner,a)} Z`;
}
function highlightRepaymentRing(index){

function drawRepaymentRing(plot,state){
  const width=plot.clientWidth,height=plot.clientHeight;
  if(width<1||height<1)return;
  const cx=width/2,cy=height/2,outer=Math.min(height/2-7,width*.185,110),inner=outer-Math.max(14,Math.min(27,outer*.26));
  const textWidth=Math.max(60,cx-outer-31),textHeight=45,minY=textHeight/2+2,maxY=height-textHeight/2-2;
  const canvas=document.createElement('canvas'),measure=canvas.getContext('2d'),family=getComputedStyle(plot).fontFamily;
  const shortName=name=>{measure.font='500 12px '+family;if(measure.measureText(name).width<=textWidth-2)return name;let chars=[...name];while(chars.length&&measure.measureText(chars.join('')+'…').width>textWidth-2)chars.pop();return chars.join('')+'…';};
  let angle=-Math.PI/2;
  const groups=repaymentRingGroups(state).map((group,index)=>{
    const start=angle,end=angle+group.share*Math.PI*2,mid=(start+end)/2,side=Math.cos(mid)>=0?1:-1;angle=end;
    return {...group,index,start,end,mid,side,y:Math.max(minY,Math.min(maxY,cy+Math.sin(mid)*(outer+10)))};
  });

    const labels=groups.filter(group=>group.side===side).sort((a,b)=>a.y-b.y),step=textHeight+7;
    for(let i=1;i<labels.length;i++)labels[i].y=Math.max(labels[i].y,labels[i-1].y+step);
    if(labels.length){labels[labels.length-1].y=Math.min(labels[labels.length-1].y,maxY);for(let i=labels.length-2;i>=0;i--)labels[i].y=Math.min(labels[i].y,labels[i+1].y-step);}
  }
  const number=money(state.chartTotal/100).replace(/[¥￥]\s*/,''),label=state.mode==='all'?'剩余待还':'应还合计';
  measure.font='650 20px '+family;
  const numberSize=Math.min(20,20*(inner*1.78)/Math.max(1,measure.measureText(number).width));
  const markup=groups.map(group=>{
    const x=cx+group.side*(outer+25),endX=x-group.side*7,startX=cx+Math.cos(group.mid)*(outer+1),startY=cy+Math.sin(group.mid)*(outer+1),bendX=cx+group.side*(outer+12);
    const anchor=group.side===1?'start':'end',backgroundX=group.side===1?x-4:x-textWidth-4,fullLabel=group.name+'，'+money(group.amount/100)+'，占当前总额 '+repaymentRingShare(group.share);

    return `<g class="repayment-ring-item" data-platform="${esc(group.name)}" data-amount="${group.amount}" data-share="${group.share}" tabindex="0" role="button" aria-label="${esc(fullLabel)}，查看明细" onpointerenter="highlightRepaymentRing(${group.index})" onpointerleave="highlightRepaymentRing(-1)" onfocus="highlightRepaymentRing(${group.index})" onblur="highlightRepaymentRing(-1)" onclick="openRepaymentBreakdown(${group.index})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openRepaymentBreakdown(${group.index});}">
      <title>${esc(fullLabel)}</title><path class="repayment-ring-segment" d="${repaymentRingArc(cx,cy,outer,inner,group.start,group.end)}" fill="${group.color}" fill-rule="evenodd" data-platform="${esc(group.name)}" data-amount="${group.amount}" data-share="${group.share}"/>
      <path class="repayment-ring-leader" d="M ${startX} ${startY} C ${bendX} ${startY} ${bendX} ${group.y} ${endX} ${group.y}" stroke="${group.color}"/><circle cx="${endX}" cy="${group.y}" r="2.2" fill="${group.color}"/>
      <g class="repayment-ring-label" data-platform="${esc(group.name)}" data-amount="${group.amount}" data-share="${group.share}" data-label-width="${textWidth}" data-side="${group.side}">
        <rect class="repayment-ring-label-background" x="${backgroundX}" y="${group.y-25}" width="${textWidth+8}" height="49" rx="5"/>
        <text class="repayment-platform-name" x="${x}" y="${group.y-12}" text-anchor="${anchor}">${esc(shortName(group.name))}</text>
        <text class="repayment-platform-amount" x="${x}" y="${group.y+5}" text-anchor="${anchor}" style="font-size:${amountSize}px">${money(group.amount/100)}</text>
        <text class="repayment-platform-share" x="${x}" y="${group.y+20}" text-anchor="${anchor}">占比 ${repaymentRingShare(group.share)}</text>
      </g></g>`;
  }).join('');
  plot.innerHTML=`<svg class="repayment-ring-svg" viewBox="0 0 ${width} ${height}" role="group" aria-label="平台金额构成，扇区表示金额占比"><g class="repayment-ring-center"><text class="repayment-ring-center-label" x="${cx}" y="${cy-9}" text-anchor="middle">${label}（元）</text><text class="repayment-ring-total" data-amount="${state.chartTotal}" x="${cx}" y="${cy+15}" text-anchor="middle" style="font-size:${numberSize}px">${number}</text></g>${markup}</svg>`;

// The annual views supply their existing monthly values, including missing and provisional points.
function annualMoneyTrend(series,label,spending,emptyText){
  const metric=spending?'spending':label==='计入收入'?'income':'balance';
  const points=series.map(({value,hint,closed})=>({value,hint,partial:spending&&!closed}));
  return `<figure class="annual-trend" data-metric="${metric}" data-points="${esc(JSON.stringify(points))}"
    data-label="${esc(label)}" data-empty="${esc(emptyText)}">
    <figcaption class="annual-trend-legend"><span>金额（元）</span>
      <span><i></i>${esc(spending?'已结算':label)}</span>
      ${spending?'<span><i class="is-partial"></i>截至盘点</span>':''}</figcaption>
    <div class="annual-trend-plot"></div>
  </figure>`;
}

function annualTrendModel(series,width,height){
  const values=series.filter(point=>Number.isFinite(point.value)).map(point=>point.value/100);
  const low=Math.min(0,...values),high=Math.max(0,...values);
  const step=niceChartStep((high-low||100)/4),min=Math.floor(low/step)*step;
  const max=Math.max(min+step,Math.ceil((high||(!values.length?100:0))/step)*step);
  const axis=value=>Math.abs(value)>=100000?
    (value/10000).toLocaleString('zh-CN',{maximumFractionDigits:1})+'万':
    value.toLocaleString('zh-CN',{maximumFractionDigits:2});
  const ticks=Array.from({length:Math.round((max-min)/step)+1},(_,i)=>{
    const value=min+i*step;
    return {value,text:axis(value)};
  });
  const left=Math.min(80,Math.max(43,Math.max(...ticks.map(tick=>tick.text.length))*7+12));
  const right=width-12,top=13,bottom=height-25,slot=(right-left)/series.length;
  const y=value=>bottom-(value-min)/(max-min)*(bottom-top);
  const points=series.map((point,index)=>({...point,x:left+(index+.5)*slot,
    y:Number.isFinite(point.value)?y(point.value/100):null}));
  return {width,height,left,right,top,bottom,slot,points,ticks:ticks.map(tick=>({...tick,y:y(tick.value)}))};
}

function annualTrendSvg(plot,label,emptyText,metric){
  const {width,height,left,right,top,bottom,slot,points,ticks}=plot;
  const grid=ticks.map(tick=>`<line x1="${left}" x2="${right}" y1="${tick.y}" y2="${tick.y}" class="annual-grid${tick.value===0?' is-zero':''}"/>
    <text x="${left-9}" y="${tick.y+4}" text-anchor="end">${esc(tick.text)}</text>`).join('');
  const lastMonth=points.length-1;
  const step=Math.max(1,Math.ceil(34/slot));
  const intervals=Math.max(1,Math.floor(lastMonth/step));
  const incomeMonths=new Set(Array.from({length:intervals+1},(_,i)=>Math.round(i*lastMonth/intervals)));
  const months=points.map((point,index)=>(metric==='income'?incomeMonths.has(index):width>=414||index%2===0||index===11)?
    `<text class="annual-month-label" x="${point.x}" y="${height-7}" text-anchor="middle">${index+1}月</text>`:'').join('');
  const solid=[],partial=[];
  for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i];
    if(a.y===null||b.y===null)continue;
    (a.partial||b.partial?partial:solid).push(`M${a.x},${a.y}L${b.x},${b.y}`);
  }
  const paths=(solid.length?`<path class="annual-line" d="${solid.join(' ')}"/>`:'')+
    (partial.length?`<path class="annual-line is-partial" d="${partial.join(' ')}"/>`:'');
  const dots=points.filter(point=>point.y!==null).map(point=>
    `<circle class="annual-dot${point.partial?' is-partial':''}" cx="${point.x}" cy="${point.y}" r="3.6"/>`).join('');
  const hits=points.map((point,index)=>point.y===null?'':`<rect class="annual-trend-hit"
    x="${point.x-slot/2}" y="${top-6}" width="${slot}" height="${bottom-top+12}"
    tabindex="0" data-index="${index}" aria-label="${esc(`${point.hint}，${label} ${money(point.value/100)}`)}"/>`).join('');
  return `<svg class="annual-trend-svg" viewBox="0 0 ${width} ${height}" role="group" aria-label="${esc(label)}趋势，纵轴单位元">
    ${grid}${months}${paths}${dots}
    ${dots?'':`<text class="annual-trend-empty" x="${(left+right)/2}" y="${(top+bottom)/2}" text-anchor="middle">${esc(emptyText)}</text>`}
    <g class="annual-trend-focus" visibility="hidden" pointer-events="none">
      <line class="annual-guide" y1="${top}" y2="${bottom}"/><circle class="annual-dot" r="5"/>
    </g>${hits}</svg>`;
}

let annualTrendObserver=null;
function decorateAnnualCharts(root=content){
  annualTrendObserver?.disconnect();
  annualTrendObserver=null;
  const figure=root.querySelector('.annual-trend');
  if(!figure)return;
  const frame=figure.querySelector('.annual-trend-plot'),series=JSON.parse(figure.dataset.points);
  const {label,empty}=figure.dataset;
  let plot=null,active=null,keyboard=null;
  function hide(){
    frame.querySelector('.annual-trend-focus')?.setAttribute('visibility','hidden');
    const tip=frame.querySelector('.chart-tooltip');if(tip)tip.hidden=true;
    active=null;
  }
  function show(index){
    const point=plot?.points[index];
    if(!point||point.y===null){hide();return;}
    if(active===index)return;
    const focus=frame.querySelector('.annual-trend-focus'),line=focus.querySelector('line'),dot=focus.querySelector('circle');
    line.setAttribute('x1',point.x);line.setAttribute('x2',point.x);
    dot.setAttribute('cx',point.x);dot.setAttribute('cy',point.y);
    dot.classList.toggle('is-partial',point.partial);
    focus.setAttribute('visibility','visible');
    const tip=frame.querySelector('.chart-tooltip');
    tip.innerHTML=`<span>${esc(point.hint)}</span><strong>${esc(money(point.value/100))}</strong>`;
    tip.hidden=false;
    const x=point.x+12+tip.offsetWidth<=plot.width-4?point.x+12:point.x-tip.offsetWidth-12;
    tip.style.left=Math.max(4,Math.min(plot.width-tip.offsetWidth-4,x))+'px';
    tip.style.top=Math.max(0,Math.min(plot.height-tip.offsetHeight,point.y-tip.offsetHeight-9))+'px';
    active=index;
  }
  function draw(){
    const width=Math.max(240,frame.clientWidth),height=Math.max(142,frame.clientHeight);
    if(plot?.width===width&&plot.height===height)return;
    plot=annualTrendModel(series,width,height);active=null;keyboard=null;
    frame.innerHTML=annualTrendSvg(plot,label,empty,figure.dataset.metric)+'<div class="chart-tooltip annual-trend-tooltip" hidden></div>';
  }
  const hitIndex=event=>event.target.closest?.('.annual-trend-hit')?.dataset.index;
  frame.addEventListener('pointermove',event=>{
    const index=hitIndex(event)??keyboard;
    if(index==null)hide();else show(index);
  });
  frame.addEventListener('pointerleave',()=>{if(keyboard==null)hide();else show(keyboard);});
  frame.addEventListener('focusin',event=>{keyboard=hitIndex(event);if(keyboard!=null)show(keyboard);});
  frame.addEventListener('focusout',()=>{keyboard=null;hide();});
  draw();
  if(typeof ResizeObserver!=='undefined'){
    annualTrendObserver=new ResizeObserver(draw);annualTrendObserver.observe(frame);
  }
}

];
let displayNameDraft=null,displayNameObserver=null;
const displayNameOrigins=new WeakMap();
function displayNameStorageKey(){return KEY+'-display-names-v1';}
function readDisplayNames(){
  try{
    const value=JSON.parse(localStorage.getItem(displayNameStorageKey())||'{}');
    if(!value||typeof value!=='object'||Array.isArray(value))return {};
    const names={};
    for(const item of displayNameCatalog){
      const text=value[item.key];
      if(typeof text==='string'&&text.trim()&&Array.from(text.trim()).length<=(item.max||16))names[item.key]=text.trim();
    }
    return names;
  }catch{return {};}
}
function displayNameMap(names){
  return new Map(displayNameCatalog.map(x=>[x.name,names[x.key]||x.name]));
}
function applyDisplayNames(){
  const names=readDisplayNames(),mapping=displayNameMap(names);
  const selector='#title,nav button>span,#workspaceSections button,#content h3,#content h4,#content .summary-label,#content .card>span:first-child,#content .metric-heading>span:first-child,#content .income-integrated-metric>span,#formTitle,#modal h3,#modal h4,#modal .card>span:first-child,[data-display-name]';
  document.querySelectorAll(selector).forEach(el=>{
    for(const node of el.childNodes){
      if(node.nodeType!==3)continue;
      const original=displayNameOrigins.get(node)||node.nodeValue,trimmed=original.trim();
      const replacement=el.dataset.displayName?(names[el.dataset.displayName]||trimmed):mapping.get(trimmed);
      if(replacement===undefined)continue;
      displayNameOrigins.set(node,original);
      const next=original.replace(trimmed,replacement);
      if(node.nodeValue!==next)node.nodeValue=next;
    }
  });
}
function decorateDisplayNames(){
  if(!displayNameObserver){

    displayNameObserver.observe(modal,{subtree:true,childList:true});

}

function compactFundingTimeline(stats){
  const entries=compactFundingEntries(stats);
  if(!entries.length)return '';
  const checkpoints=[
    {label:'月中盘点',date:stats.midTotal!==null?stats.record.mid.date:null},
    {label:'月末盘点',date:stats.endTotal!==null?stats.record.end.date:null}
  ].filter(item=>item.date);
  const groups=new Map();
  for(const entry of entries){
    const sameDay=checkpoints.filter(item=>item.date===entry.date);
    const previous=checkpoints.filter(item=>item.date<entry.date).at(-1);
    const next=checkpoints.find(item=>item.date>entry.date);
    const label=sameDay.length?sameDay.map(item=>item.label).join(' / ')+'当日 · 顺序未确认':
      (previous?previous.label+'后':'月初')+(next?'至'+next.label+'前':'');
    if(!groups.has(label))groups.set(label,[]);
    groups.get(label).push(entry);
  }
  return '<section class="compact-funding-timeline"><h4>拨入按盘点区间</h4>'+
    Array.from(groups,([label,rows])=>'<h5>'+label+'</h5>'+compactFundingRows(rows)).join('')+'</section>';
}

function openCompactDetails(kind){

      '<p class="unified-note">收入分配沿用实际到账日期，荷包转回按划转日期记录。</p>'+
      compactFundingRows(rows)+(undated?'<p class="unified-note">无逐笔日期的拨入 '+consumptionMoney(undated)+'</p>':'');
  }else if(kind==='daily'){
    const daily=consumptionMonthStats(m,data,'daily');
    const stat=(label,period)=>'<div><span>'+label+'</span><strong>'+consumptionMoney(period?.spent??null)+'</strong><small>'+(period?spendingAnalysisRange(period.startDate,period.date):'等待盘点')+'</small></div>';

  }else{
    const annual=consumptionYearStats(m.slice(0,4),data,'daily');
    markup=unifiedAnnualSummary(m,annual)+compactAnnualRows(annual);
  }
  markup=markup.replaceAll('onclick="openConsumptionEditor(', 'onclick="openCompactInventory(');
  modal.classList.add('wide-dialog','compact-detail-dialog');
  formTitle.textContent=kind==='annual'?m.slice(0,4)+' 年 · 年度统计':m+' · '+titles[kind];
  document.getElementById('modalSubmit').textContent='关闭';
  fields.innerHTML='<div class="compact-detail-view" data-compact-view="'+kind+'">'+markup+'</div>';
  form.onsubmit=event=>{event.preventDefault();closeCompactDetails();};
  modal.showModal();
  fields.scrollTop=0;
  alignMoneyColumns(fields);
  if(kind==='annual')requestAnimationFrame(()=>{if(modal.open&&fields.querySelector('[data-compact-view="annual"]'))decorateAnnualCharts(fields);});
}

const spendingChannels={
  wechat:{label:'微信',defaults:['餐饮','生活缴费','娱乐','购物']},
  alipay:{label:'支付宝',defaults:['休闲玩乐','转账','餐饮','交通','购物']},
  bank:{label:'银行卡',defaults:['餐饮','购物','出行','缴费','娱乐','服务','其他']}
};
const spendingWechatAccounts={wechat1:'微信 1',wechat2:'微信 2'};
const spendingCategoryColors={
  food:'#20684f',shopping:'#d6754f',travel:'#356fb0',bills:'#e3b33c',
  entertainment:'#7855a6',services:'#62b6c9',other:'#7a8594',transfer:'#a44067'
};
const spendingAliases=new Map([
  ['生活缴费','bills'],['居住缴费','bills'],['交通','travel'],['交通出行','travel'],
  ['休闲玩乐','entertainment'],['休闲娱乐','entertainment'],['生活服务','services'],
  ['转账','transfer'],['划转','transfer'],['非消费转出','transfer'],['每日荷包','transfer']
]);

function spendingMappedCategory(source){
  const name=source.trim();
  return spendingAliases.get(name)||Object.keys(expenseCategories).find(key=>expenseCategories[key].label===name)||'other';
}

function spendingSummaryFor(m,kind,ledger=data){
  return (ledger.spendingSummaries||[]).find(summary=>summary.month===m&&summary.kind===kind);
}

function validateSpendingSummaries(ledger){
  if(!Object.hasOwn(ledger,'spendingSummaries'))return;
  if(!Array.isArray(ledger.spendingSummaries))throw Error('分类花费记录格式无效。');
  const slots=new Map();
  for(const summary of ledger.spendingSummaries){
    if(!consumptionObject(summary)||!validMonth(summary.month)||!['mid','end'].includes(summary.kind)||
       !validDate(summary.from)||!validDate(summary.through)||summary.from.slice(0,7)!==summary.month||
       summary.through.slice(0,7)!==summary.month||summary.from>summary.through||
       (summary.kind==='mid'&&(summary.from!==summary.month+'-01'||summary.through===monthEnd(summary.month)))||
       !Array.isArray(summary.items)||!summary.items.length){
      throw Error('请核对分类花费的盘点日期和录入条目。');
    }
    const key=summary.month+'|'+summary.kind;
    if(slots.has(key))throw Error('同一盘点区间有重复的分类花费记录。');
    slots.set(key,summary);
    for(const item of summary.items){
      if(!consumptionObject(item)||typeof item.channel!=='string'||!Object.hasOwn(spendingChannels,item.channel)||
         typeof item.source!=='string'||!item.source.trim()||
         typeof item.category!=='string'||(item.category!=='transfer'&&!Object.hasOwn(expenseCategories,item.category))||
         (Object.hasOwn(item,'wechatAccount')&&(item.channel!=='wechat'||typeof item.wechatAccount!=='string'||
          !Object.hasOwn(spendingWechatAccounts,item.wechatAccount)))||
         !validConsumptionAmount(item.amount)){
        throw Error('请核对原条目、归入品类与金额。');
      }
    }
  }
  for(const summary of slots.values()){
    const mid=slots.get(summary.month+'|mid');
    if(summary.kind==='end'&&mid&&summary.from<=mid.through){
      throw Error('月中与月末的分类花费日期重叠。请先调整月末分类的起始日期。');
    }
  }
}

function spendingEnteredAmount(raw){
  const value=raw.trim();
  if(!value)return null;
  const text=value.replace(/[￥¥,，\s]/g,'').replace(/^−/,'-');
  if(!/^[+-]?(?:\d+(?:\.\d{0,2})?|\.\d{1,2})$/.test(text)){
    throw Error('金额请填写数字，最多保留两位小数。');
  }
  const amount=Math.abs(Number(text));
  if(!validConsumptionAmount(amount))throw Error('请填写有效金额。');
  return amount;
}

function spendingSum(values){
  const entered=values.filter(value=>value!==null);
  return entered.length?entered.reduce((total,value)=>total+value,0):null;
}

function spendingTableData(summaries){
  const channels=Object.keys(spendingChannels),categories=[...Object.keys(expenseCategories),'transfer'];
  const values=Object.fromEntries(categories.map(category=>
    [category,Object.fromEntries(channels.map(channel=>[channel,null]))]));
  for(const summary of summaries){
    for(const item of summary.items){
      values[item.category][item.channel]=(values[item.category][item.channel]??0)+cents(item.amount);
    }
  }
  const transfers=channels.map(channel=>values.transfer[channel]);
  const totals=channels.map(channel=>spendingSum(categories.map(category=>values[category][channel])));
  return {channels,values,transfers,totals,total:spendingSum(totals)};
}

function spendingPeriodLabel(summary){
  return summary.kind==='mid'?'月初至月中':summary.from===summary.month+'-01'?'月初至月末':'月中至月末';
}

function consumptionOutgoingNote(label,amount){
  return `<span class="consumption-outgoing-note"><span>${label}</span><span>${money(amount/100)}</span></span>`;
}

function spendingSummaryNote(summaries){
  if(!summaries.length)return '<div class="spending-inline-note">可在月中或月末盘点里录入各渠道的分类花费。</div>';
  const {total,transfers}=spendingTableData(summaries),transfer=spendingSum(transfers);
  const note=transfer>0?consumptionOutgoingNote('含非消费转出',transfer):'';
  return `<div class="spending-inline-note"><span>已录支出合计</span>
    <b>${consumptionMoney(total)}</b>${note}</div>`;
}

function spendingTransferForInterval(interval,summaries){
  const covered=summaries.filter(summary=>summary.from>=interval.startDate&&summary.through<=interval.date);
  return spendingSum(spendingTableData(covered).transfers)??interval.outgoing;
}

function spendingSharePlot(categories,total,totalLabel,emptyText){
  const plotted=categories.filter(({amount})=>amount>0);
  if(!total)return `<p class="spending-share-empty">${emptyText}</p>`;

  let offset=0;
  const slices=plotted.map(({key,label,amount})=>{
    const share=amount/total*100;
    const percent=share<0.05?'&lt;0.1%':Number(share.toFixed(1))+'%';
    const gap=plotted.length>1?Math.min(0.55,share*0.16):0;
    const arc=share-gap;
    const slice={label,amount,arc,percent,offset:offset+gap/2,color:spendingCategoryColors[key]};
    offset+=share;
    return slice;
  });

  return `<div class="spending-share-ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g fill="none" stroke-width="27" transform="rotate(-90 100 100)">
          ${slices.map(({label,amount,arc,percent,offset,color})=>`
            <circle cx="100" cy="100" r="83" pathLength="100" stroke="${color}"
              stroke-dasharray="${arc} ${100-arc}" stroke-dashoffset="${-offset}">
              <title>${label} · ${money(amount/100)} · ${percent}</title>
            </circle>`).join('')}
        </g>
      </svg>
      <div class="spending-share-total">
        <span>${totalLabel}</span><strong>${money(total/100)}</strong>
      </div>
    </div>
    <ul class="spending-share-legend">
      ${slices.map(({label,percent,color})=>`<li>
        <span class="spending-share-key" style="background:${color}" aria-hidden="true"></span>
        <span>${label}</span><b>${percent}</b>
      </li>`).join('')}
    </ul>`;
}

function spendingSplitFor(summary,ledger=data){
  const record=(ledger.spendingSplits||[]).find(split=>split.month===summary.month&&split.kind===summary.kind&&
    split.from===summary.from&&split.through===summary.through);
  return record?spendingSplitsWithinTotals(summary,record.adjustableCents):{};
}

function writeSpendingSplit(ledger,summary,splits){
  const {month,kind,from,through}=summary;
  const records=(ledger.spendingSplits||[]).filter(split=>split.month!==month||split.kind!==kind);
  if(Object.keys(splits).length)records.push({month,kind,from,through,adjustableCents:splits});
  if(records.length)ledger.spendingSplits=records;
  else delete ledger.spendingSplits;
}

function validateSpendingSplits(ledger){
  if(!Object.hasOwn(ledger,'spendingSplits'))return;
  if(!Array.isArray(ledger.spendingSplits))throw Error('可调开支拆分格式无效。');
  const categories=new Set([...Object.keys(expenseCategories),'transfer']),slots=new Set();
  for(const split of ledger.spendingSplits){
    if(!consumptionObject(split)||!validMonth(split.month)||!['mid','end'].includes(split.kind)||
       !validDate(split.from)||!validDate(split.through)||split.from.slice(0,7)!==split.month||
       split.through.slice(0,7)!==split.month||split.from>split.through||
       (split.kind==='mid'&&(split.from!==split.month+'-01'||split.through===monthEnd(split.month)))){
      throw Error('请核对可调开支的盘点区间。');
    }
    const slot=split.month+'|'+split.kind;
    if(slots.has(slot))throw Error('同一盘点区间有重复的可调开支拆分。');
    slots.add(slot);
    const amounts=split.adjustableCents;
    if(!consumptionObject(amounts)||!Object.keys(amounts).length||
       Object.entries(amounts).some(([key,amount])=>!categories.has(key)||!Number.isSafeInteger(amount)||amount<0)){
      throw Error('可调开支的品类或金额无效。');
    }
  }
}

function spendingCategoryTotals(summary){
  const {values}=spendingTableData([summary]);
  return Object.fromEntries(Object.entries(values).map(([key,channels])=>
    [key,spendingSum(Object.values(channels))]));
}

function spendingSplitsWithinTotals(summary,splits){
  const limits=spendingCategoryTotals(summary);
  return Object.fromEntries(Object.entries(splits).filter(([key,amount])=>
    limits[key]>0&&Number.isSafeInteger(amount)&&amount>=0&&amount<=limits[key]));
}

function readSpendingAmountCents(raw){
  if(!raw.trim())return null;
  const text=raw.replace(/[¥￥,，\s]/g,'');
  return /^(?:\d+(?:\.\d{0,2})?|\.\d{1,2})$/.test(text)?cents(Number(text)):NaN;
}

function validateSpendingPocketAssignments(ledger){
  if(!Object.hasOwn(ledger,'spendingPocketAssignments'))return;
  if(!Array.isArray(ledger.spendingPocketAssignments))throw Error('荷包归入记录格式无效。');
  const slots=new Set();
  for(const item of ledger.spendingPocketAssignments){
    if(!consumptionObject(item)||!validMonth(item.month)||!['mid','end'].includes(item.kind)||
       !validDate(item.from)||!validDate(item.through)||item.from.slice(0,7)!==item.month||
       item.through.slice(0,7)!==item.month||item.from>item.through||
       (item.kind==='mid'&&(item.from!==item.month+'-01'||item.through===monthEnd(item.month)))){
      throw Error('请核对荷包归入记录的盘点区间。');
    }
    const slot=item.month+'|'+item.kind;
    if(slots.has(slot))throw Error('同一盘点区间有重复的荷包归入记录。');
    slots.add(slot);
    const amounts=item.amountsCents;
    if(!consumptionObject(amounts)||!Object.keys(amounts).length||
       Object.entries(amounts).some(([key,amount])=>!Object.hasOwn(expenseCategories,key)||
         !Number.isSafeInteger(amount)||amount<=0)){
      throw Error('荷包归入的品类或金额无效。');
    }
  }
}

function spendingBreakdown(summaries,ledger=data){
  const {channels,values,totals,total}=spendingTableData(summaries);
  const periods=summaries.map(summary=>({
    amounts:spendingCategoryTotals(summary),splits:spendingSplitFor(summary,ledger)
  }));
  const categories=[...Object.entries(expenseCategories),['transfer',{label:'非消费转出'}]]
    .map(([key,{label}])=>{
      const amounts=channels.map(channel=>values[key][channel]),amount=spendingSum(amounts);
      const splits=periods.filter(period=>period.amounts[key]>0).map(period=>period.splits[key]??null);
      const adjustable=amount===null||splits.includes(null)?null:spendingSum(splits)??0;
      return {key,label,amounts,amount,adjustable};
    });
  return {channels,totals,total,categories};
}

function spendingSplitTotals(categories,total,adjustableFor=category=>category.adjustable){
  const splits=categories.filter(category=>category.amount>0).map(adjustableFor);
  const missing=splits.filter(amount=>amount===null).length;
  const adjustable=total===null||missing?null:spendingSum(splits)??0;
  return {missing,adjustable,necessary:adjustable===null?null:total-adjustable};
}

function spendingNecessarySummary(summaries,ledger=data){
  const {categories,total}=spendingBreakdown(summaries,ledger);
  const {necessary,missing}=spendingSplitTotals(categories,total);
  const coverage=[...summaries].sort((a,b)=>a.from.localeCompare(b.from))
    .map(summary=>summary.from.slice(5)+' 至 '+summary.through.slice(5)).join('、');
  return {amount:necessary,missing,coverage};
}

function spendingNecessaryMonthMetric(summaries){
  const {amount,missing,coverage}=spendingNecessarySummary(summaries);
  const note=missing?'有 '+missing+' 项分类待拆分':coverage?'已录 '+coverage:'等待录入分类花费';
  return consumptionMetric('本月必要支出',amount,note);
}

function spendingNecessaryYear(rows,ledger=data){
  const summaries=ledger.spendingSummaries||[];
  const byMonth=new Map(rows.map(row=>[row.month,
    spendingNecessarySummary(summaries.filter(summary=>summary.month===row.month),ledger)]));
  const months=[...byMonth.values()];
  const amount=spendingSum(months.map(summary=>summary.amount));
  const recorded=months.filter(summary=>summary.amount!==null).length;
  const pending=months.filter(summary=>summary.missing>0).length;
  const note=[recorded?'按 '+recorded+' 个月已录分类汇总':'',pending?pending+' 个月待拆分':'']
    .filter(Boolean).join(' · ')||'等待录入分类花费';
  return {byMonth,amount,note};
}

function spendingNecessaryCell(summary){
  if(summary.missing)return '<span class="consumption-necessary-pending">待拆分</span>';
  if(summary.amount===null)return consumptionMoney(null);
  return `<span title="已录 ${esc(summary.coverage)}">${consumptionMoney(summary.amount)}</span>`;
}


function openSpendingSummary(kind='month',chartMode='total'){

  fields.innerHTML=`<div class="spending-split-view">

    </div>

      <section class="spending-share" aria-labelledby="spendingShareTitle">
        <h4 id="spendingShareTitle">支出构成</h4>
        <div class="chart-switch split-chart-switch" role="group" aria-label="支出构成口径">
          ${[['total','总支出'],['necessary','必要开支']].map(([mode,label])=>`<button type="button"
            data-split-chart-mode="${mode}" aria-controls="spendingSplitPlot" aria-pressed="${mode===chartMode}"
            class="${mode===chartMode?'selected':''}">${label}</button>`).join('')}
        </div>
        <div id="spendingSplitPlot" class="split-chart-plot"></div>
      </section>
      <div class="spending-review-table">${table(['统一品类','品类合计','可调开支','必要开支',
        ...channels.map(channel=>spendingChannels[channel].label)],categories.slice(0,-1).map(categoryRow),footer)}</div>
    </div>
    <div class="spending-review-toolbar split-review-footer">
      <div class="split-guide">
        <div>必要开支 = 品类合计 − 可调开支。填 0 表示整项归为必要。</div>
        <div id="spendingSplitStatus" class="muted" aria-live="polite"></div>
      </div>
      <div class="toolbar">
        <button type="button" id="openScreenshotImport">截图导入</button><button type="button" id="openMidSpending">录入月中</button>
        <button type="button" id="openEndSpending">录入月末</button><button type="button" class="primary" id="openSpendingOcr">识别截图</button></div>
    </div>
  </div>`;

  document.getElementById('openScreenshotImport').onclick=()=>openSpendingScreenshotImport(kind,chartMode);
  const inputs=[...fields.querySelectorAll('[data-adjustable]')];
  const categoryByKey=new Map(categories.map(category=>[category.key,category]));
  const necessaryCells=new Map([...fields.querySelectorAll('[data-necessary]')].map(cell=>[cell.dataset.necessary,cell]));
  const status=document.getElementById('spendingSplitStatus');
  const adjustableTotal=document.getElementById('splitAdjustableTotal');
  const necessaryTotal=document.getElementById('splitNecessaryTotal');
  const plot=document.getElementById('spendingSplitPlot');
  const chartButtons=[...fields.querySelectorAll('[data-split-chart-mode]')];

  function updateDraft(){
    const draft={};
    let invalid=null,error='';
    for(const input of inputs){
      const {key,label,amount}=categoryByKey.get(input.dataset.adjustable);
      const value=readSpendingAmountCents(input.value);
      const bad=value!==null&&(!Number.isSafeInteger(value)||value>amount);
      if(bad){
        input.setAttribute('aria-invalid','true');
        if(!invalid){
          invalid=input;
          error=label+'的可调开支请填 0 至 '+money(amount/100)+'，最多两位小数。';
        }
      }else{
        input.removeAttribute('aria-invalid');
        if(value!==null)draft[key]=value;
      }
      necessaryCells.get(key).innerHTML=consumptionMoney(Object.hasOwn(draft,key)?amount-draft[key]:null);
    }
    const adjustableFor=category=>editable&&category.amount>0?draft[category.key]??null:category.adjustable;
    const {missing,adjustable:sum,necessary}=spendingSplitTotals(categories,total,adjustableFor);
    adjustableTotal.innerHTML=consumptionMoney(sum);
    necessaryTotal.innerHTML=consumptionMoney(necessary);
    if(chartMode==='necessary'){
      const necessaryCategories=categories.map(category=>{
        const adjustable=adjustableFor(category);
        return {...category,amount:adjustable===null?null:category.amount-adjustable};
      });
      const emptyText=total===null?'该区间等待录入。':missing?'填齐可调开支后显示必要构成。':'该区间必要开支为 ¥0.00。';
      plot.innerHTML=spendingSharePlot(necessaryCategories,necessary,'必要合计',emptyText);
    }else{
      plot.innerHTML=spendingSharePlot(categories,total,'支出合计','暂无分类花费');
    }
    status.classList.toggle('negative',!!invalid);
    if(invalid)status.textContent=error;
    else if(!selected.length)status.textContent='该区间等待录入。';
    else{
      const detail=editable?'可直接填写，完成或切换区间时保存。':'整月由月中和月末汇总，请切换到对应区间填写。';
      status.textContent=missing?'有 '+missing+' 项待拆分。'+detail:detail;
    }
    return {draft,invalid};
  }

  function saveDraft(){
    if(!editable)return true;
    const {draft,invalid}=updateDraft();
    if(invalid){
      invalid.focus();
      return false;
    }
    const saved=spendingSplitFor(editable);
    if(Object.keys(draft).length===Object.keys(saved).length&&Object.entries(draft).every(([key,amount])=>saved[key]===amount)){
      return true;
    }
    try{
      ensureEditorFresh(snapshot);
      const next=structuredClone(data),summary=spendingSummaryFor(m,editable.kind,next);
      writeSpendingSplit(next,summary,draft);
      return commitFinance(next);
    }catch(error){
      alert(error.message);
      return false;
    }
  }

  for(const input of inputs)input.oninput=updateDraft;
  for(const button of chartButtons)button.onclick=()=>{
    chartMode=button.dataset.splitChartMode;
    for(const option of chartButtons){
      const selected=option===button;
      option.classList.toggle('selected',selected);
      option.setAttribute('aria-pressed',String(selected));
    }
    updateDraft();
  };
  updateDraft();
  document.getElementById('spendingReviewRange').onchange=event=>{
    const next=event.target.value;
    if(!saveDraft()){
      event.target.value=kind;
      return;
    }
    openSpendingSummary(next,chartMode);
    document.getElementById('spendingReviewRange').focus({preventScroll:true});
  };
  document.getElementById('openSpendingOcr').onclick=()=>{modal.close();window.openOcrImport(kind==='end'?'end':kind==='mid'?'mid':summaries.some(s=>s.kind==='mid')?'end':'mid');};
  for(const [id,slot] of [['openMidSpending','mid'],['openEndSpending','end']]){
    document.getElementById(id).onclick=()=>{
      if(!saveDraft())return;
      modal.close();
      openConsumptionEditor(slot,true,'daily');
    };
  }
  form.onsubmit=event=>{
    event.preventDefault();
    if(saveDraft())modal.close();
  };
  if(!modal.open)modal.showModal();
}

function mountSpendingEntry(m,kind,record,saveOnly){
  let saved=spendingSummaryFor(m,kind),channel='wechat',wechatAccount='wechat1',dirty=false;
  const priorMid=spendingSummaryFor(m,'mid')?.through||record.mid?.date;
  const start=saved?.from||(kind==='end'&&priorMid?shiftDay(priorMid,1):m+'-01');
  const balanceDate=document.getElementById('consumeDate');
  const from=document.getElementById('spendingFrom'),through=document.getElementById('spendingThrough');
  from.min=m+'-01';
  from.max=monthEnd(m);
  from.value=start;
  from.readOnly=kind==='mid';
  through.min=from.min;
  through.max=kind==='mid'?shiftDay(from.max,-1):from.max;
  through.value=saved?.through||balanceDate.value;
  let followBalanceDate=!saved;
  const groups=[...Object.keys(spendingWechatAccounts).map(account=>({key:account,channel:'wechat',account})),
    {key:'alipay',channel:'alipay'},{key:'bank',channel:'bank'}];
  const drafts=new Map(groups.map(group=>{
    const rows=(saved?.items||[]).filter(item=>item.channel===group.channel&&
      (!group.account||(item.wechatAccount||'wechat1')===group.account))
      .map(item=>({source:item.source,amount:String(item.amount),category:item.category}));
    for(const source of spendingChannels[group.channel].defaults){
      if(!rows.some(item=>item.source===source))rows.push({source,amount:'',category:spendingMappedCategory(source)});
    }
    return [group.key,{...group,rows}];
  }));
  const rowsHost=document.getElementById('spendingRows'),tabs=document.getElementById('spendingChannels');
  const wechatTabs=document.getElementById('spendingWechatAccounts');
  const currentDraft=()=>drafts.get(channel==='wechat'?wechatAccount:channel).rows;
  const coverage=document.getElementById('spendingCoverage'),status=document.getElementById('spendingStatus');
  const updateCoverage=()=>{
    coverage.textContent=saved?'已保存 '+saved.from.slice(5)+' 至 '+saved.through.slice(5):
      '按所选区间填写各渠道的分类合计。分类花费与余额分别保存。';
  };
  const markDirty=()=>{dirty=true;status.textContent='有待保存的分类改动';};
  const options=[...Object.entries(expenseCategories).map(([key,{label}])=>[key,label]),['transfer','非消费转出']];
  function draw(){
    tabs.innerHTML=Object.entries(spendingChannels).map(([key,{label}])=>
      `<button type="button" data-spending-channel="${key}" aria-pressed="${key===channel}" class="${key===channel?'selected':''}">${label}</button>`).join('');
    for(const button of tabs.querySelectorAll('button')){
      button.onclick=()=>{channel=button.dataset.spendingChannel;draw();};
    }
    wechatTabs.hidden=channel!=='wechat';
    wechatTabs.innerHTML=Object.entries(spendingWechatAccounts).map(([key,label])=>
      `<button type="button" data-wechat-account="${key}" aria-pressed="${key===wechatAccount}" class="${key===wechatAccount?'selected':''}">${label}</button>`).join('');
    for(const button of wechatTabs.querySelectorAll('button')){
      button.onclick=()=>{wechatAccount=button.dataset.wechatAccount;draw();};
    }
    const rows=currentDraft();
    rowsHost.innerHTML=`<table class="spending-input-table">
      <thead><tr><th>原条目</th><th>金额（元）</th><th>归入品类</th></tr></thead>
      <tbody>${rows.map((entry,index)=>`<tr data-spending-row="${index}">
        <td><input data-source aria-label="原条目" value="${esc(entry.source)}" placeholder="原账单条目"></td>
        <td><input data-amount aria-label="金额" inputmode="decimal" value="${esc(entry.amount)}" placeholder="可直接填负数"></td>
        <td><select data-category aria-label="归入品类">${options.map(([key,label])=>
          `<option value="${key}" ${key===entry.category?'selected':''}>${label}</option>`).join('')}</select></td>
      </tr>`).join('')}</tbody></table>`;
    for(const tr of rowsHost.querySelectorAll('[data-spending-row]')){
      const entry=rows[Number(tr.dataset.spendingRow)];
      const source=tr.querySelector('[data-source]'),amount=tr.querySelector('[data-amount]'),category=tr.querySelector('[data-category]');
      source.oninput=()=>{
        entry.source=source.value;
        entry.category=spendingMappedCategory(entry.source);
        category.value=entry.category;
        markDirty();
      };
      amount.oninput=()=>{entry.amount=amount.value;markDirty();};
      category.onchange=()=>{entry.category=category.value;markDirty();};
    }
  }
  function apply(next){
    const items=[];
    for(const {channel,account,rows} of drafts.values()){
      for(const row of rows){
        const amount=spendingEnteredAmount(row.amount);
        if(amount===null)continue;
        const source=row.source.trim();
        if(!source)throw Error('有金额的条目请填写原条目名称。');
        items.push({channel,source,category:row.category,amount,...(account?{wechatAccount:account}:{})});
      }
    }
    const kept=(next.spendingSummaries||[]).filter(summary=>summary.month!==m||summary.kind!==kind);
    const updated={month:m,kind,from:from.value,through:through.value,items};
      const sameRange=saved?.from===updated.from&&saved.through===updated.through;
      const splits=sameRange?spendingSplitsWithinTotals(updated,spendingSplitFor(saved,next)):{};
      writeSpendingSplit(next,updated,splits);
      next.spendingSummaries=items.length?kept.concat(updated):kept;
  }
  document.getElementById('spendingAddRow').onclick=()=>{
    currentDraft().push({source:'',amount:'',category:'other'});
    draw();
    rowsHost.querySelector('tbody tr:last-child input').focus();
  };
  document.getElementById('spendingSave').onclick=()=>{
    try{
      if(!saveOnly(apply))return;
      dirty=false;
      saved=spendingSummaryFor(m,kind);
      if(saved)followBalanceDate=false;
      status.textContent=saved?'分类花费已保存':'本段分类花费已清空';
      updateCoverage();
    }catch(error){alert(error.message);}
  };
  from.oninput=markDirty;
  through.oninput=()=>{followBalanceDate=false;markDirty();};
  balanceDate.addEventListener('input',()=>{if(followBalanceDate)through.value=balanceDate.value;});
  updateCoverage();
  draw();
  return {apply,hasChanges:()=>dirty};
}

  travel:{label:'出行',examples:'公交地铁、打车、加油、停车、火车票和机票'},

  services:{label:'服务',examples:'理发美容、维修、快递、医疗、教育'},
  other:{label:'其他',examples:'红包、礼金、人情往来、暂难归类的实际支出'}

function validateExpenseEntries(ledger){
  if(!Object.hasOwn(ledger,'expenseEntries'))return;
  if(!Array.isArray(ledger.expenseEntries))throw Error('逐笔消费明细格式无效。');
  const ids=new Set();
  for(const entry of ledger.expenseEntries){
    if(!consumptionObject(entry)||typeof entry.id!=='string'||!entry.id.trim()||ids.has(entry.id)||
      !validDate(entry.date)||typeof entry.category!=='string'||!Object.hasOwn(expenseCategories,entry.category)||
      !validConsumptionAmount(entry.amount)||entry.amount===0||
      !['','necessary','adjustable'].includes(entry.tag)||typeof entry.note!=='string'){
      throw Error('逐笔消费的编号、日期、品类、金额、标记或备注无效。');
    }
    ids.add(entry.id);
  }
}

const timelineSortModes=['time-asc','time-desc','amount-desc','amount-asc'];
let financeTimelineSort='time-asc',consumptionTimelineSort='time-desc';

function sortTimelineRows(rows,mode,dateOf,amountOf){
  const byAmount=mode.startsWith('amount-'),direction=mode.endsWith('-asc')?1:-1;
  return rows.slice().sort((a,b)=>{
    const dates=dateOf(a).localeCompare(dateOf(b));
    if(!byAmount)return dates*direction;
    const left=amountOf(a),right=amountOf(b);
    if(left===null&&right!==null)return 1;
    if(right===null&&left!==null)return -1;
    return (left-right)*direction||dates;
  });
}

function timelineSortControl(id,label,amountLabel,mode,handler){
  const labels=['时间从早到晚','时间从晚到早',amountLabel+'从高到低',amountLabel+'从低到高'];
  return `<label class="sort-control">排序<select id="${id}" aria-label="${label}" onchange="${handler}(this.value)">
    ${timelineSortModes.map((value,i)=>`<option value="${value}" ${mode===value?'selected':''}>${labels[i]}</option>`).join('')}
  </select></label>`;
}

function consumptionTrendMarks(points,y,spending,pointTitle){
  const lineClass=spending?'consumption-spend-line':'consumption-balance-line';
  const dotClass=spending?'consumption-spend-dot':'consumption-balance-dot';
  const solid=[],partial=[];
  const position=point=>`${point.x},${y(point.value/100)}`;
  for(let index=1;index<points.length;index++){
    const previous=points[index-1],current=points[index];
    if(previous.value===null||current.value===null)continue;
    const series=spending&&(!previous.closed||!current.closed)?partial:solid;
    series.push(`M ${position(previous)} L ${position(current)}`);
  }
  const lines=`<path class="${lineClass}" d="${solid.join(' ')}"/>`+
    (partial.length?`<path class="${lineClass} is-partial" d="${partial.join(' ')}"/>`:'');
  const dots=points.filter(point=>point.value!==null).map(point=>{
    const pending=spending&&!point.closed?' is-partial':'';
    const negative=spending&&point.value<0?' is-negative':'';
    return `<circle class="${dotClass}${pending}${negative}" cx="${point.x}" cy="${y(point.value/100)}" r="4.5">${pointTitle(point)}</circle>`;
  }).join('');
  return lines+dots;
}


const pocketAccountId='@pocket';

function pocketTransferNet(ledger,through){
  let net=0;
  for(const transfer of ledger.transfers||[]){
    if(transfer.voided||transfer.date>through)continue;
    if(transfer.toAccountId===pocketAccountId)net+=cents(transfer.amount);
    if(transfer.fromAccountId===pocketAccountId)net-=cents(transfer.amount);
  }
  return net;
}

// The saved offset separates transfers already included in a physical count from spending.
function pocketInventoryBalance(balances,ledger,through){
  if(balances?.wallet==null)return null;
  return cents(balances.wallet)-(balances.accountTransferNet||0)+pocketTransferNet(ledger,through);
}

function pocketAccountBalance(ledger=data,through=localDay()){
  let latestDate='',balance=null;
  for(const record of ledger.pocketMonths||[]){
    for(const [date,balances] of [
      [shiftDay(record.month+'-01',-1),record.opening],
      [record.mid?.date,record.mid?.balances],
      [record.end?.date,record.end?.balances]
    ]){
      if(date&&date<=through&&date>=latestDate&&balances?.wallet!=null){
        latestDate=date;
        balance=pocketInventoryBalance(balances,ledger,through);
      }
    }
  }
  return balance;
}

function transferAccountOptions(selected){
  const balance=pocketAccountBalance();
  return accountOptions(selected)+

}

function pocketDisplayedBalance(m,recorded){

  const through=end<today?end:today;
  const hasTransfer=data.transfers.some(t=>t.date<=through&&[t.fromAccountId,t.toAccountId].includes(pocketAccountId));
  return hasTransfer?pocketAccountBalance(data,through):recorded;
}
