const KEY='yuliang-finance-android-test-v1';
const BEFORE_IMPORT=KEY+'-before-trip-import-20261104';
const BEFORE_UPDATE=KEY+'-before-v25';

const money=n=>'¥ '+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const id=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((s,x)=>s+Number(x.amount),0);
const consumptionScopes={
  daily:{key:'consumptionMonths',accounts:[['wechat','微信'],['alipay','支付宝'],['bank','银行卡']]},
  pocket:{key:'pocketMonths',accounts:[['wallet','荷包']]}
};
const consumptionAllocationNames=new Set(['日常消费','日常预算']);
const pocketAllocationNames=new Set(['恋爱小金库','耍朋友荷包','恋爱荷包']);
const consumptionMoneyLimit=999999999.99;
let consumptionView='month',consumptionChartMode='spent',consumptionScope='daily';

function consumptionObject(value){
  return value!==null&&typeof value==='object'&&!Array.isArray(value);
}

function validConsumptionAmount(amount){
  return typeof amount==='number'&&amount>=0&&amount<=consumptionMoneyLimit&&amount===cents(amount)/100;
}

function validateConsumptionBalances(balances,accounts,allowTotal){
  if(!consumptionObject(balances)||!accounts.every(([key])=>balances[key]===null||validConsumptionAmount(balances[key]))){
    throw Error('消费盘点余额必须为有效的两位小数，未填写的余额应留空。');
  }
  if(!allowTotal&&Object.hasOwn(balances,'accountTransferNet')&&
    (balances.wallet===null||!Number.isSafeInteger(balances.accountTransferNet))){
    throw Error('荷包盘点的账户互转净额无效。');
  }
  if(hasManualConsumptionTotal(balances)&&(!allowTotal||
    (balances.total!==null&&!validConsumptionAmount(balances.total))||accounts.some(([key])=>balances[key]!==null))){
    throw Error('总余额必须为有效的两位小数，并按总额模式填写。');
  }
}

function validateConsumptionMonths(records,scope){
  if(!Array.isArray(records))throw Error('消费盘点明细格式无效。');
  const {accounts}=consumptionScopes[scope];
  const seen=new Set();
  for(const record of records){
    if(!consumptionObject(record)||!validMonth(record.month)||seen.has(record.month)){
      throw Error('消费盘点月份无效或重复。');
    }
    seen.add(record.month);
    if(Object.hasOwn(record,'opening'))validateConsumptionBalances(record.opening,accounts,scope==='daily');
    for(const kind of ['mid','end']){
      if(!Object.hasOwn(record,kind))continue;
      const snapshot=record[kind];
      if(!consumptionObject(snapshot)||!validDate(snapshot.date)||snapshot.date.slice(0,7)!==record.month||
        (kind==='mid'&&snapshot.date===monthEnd(record.month))){
        throw Error('请填写所选月份内的盘点日期，月中盘点须早于月末。');
      }
      validateConsumptionBalances(snapshot.balances,accounts,scope==='daily');
      if(!validConsumptionAmount(snapshot.outgoing))throw Error('消费盘点的非消费转出金额无效。');
      if(scope==='pocket'&&!validConsumptionAmount(snapshot.extraIn))throw Error('荷包额外存入金额无效。');
    }
    const {mid,end}=record;
    if(end&&mid&&mid.date>=end.date)throw Error('月末盘点日期须晚于月中盘点。');
    if(end&&(typeof end.sinceMid!=='boolean'||(end.sinceMid&&!mid)))throw Error('月末盘点的非消费转出区间无效。');
    if(end&&mid&&!end.sinceMid&&end.outgoing<mid.outgoing){
      throw Error('月中非消费转出超过已登记的整段合计，请先核对月末记录。');
    }
    if(scope==='pocket'&&end&&mid&&!end.sinceMid&&end.extraIn<mid.extraIn){
      throw Error('月中额外存入超过已登记的整段合计，请先核对月末记录。');
    }
  }
}

function validateConsumptionLedger(ledger){
  for(const [scope,{key}] of Object.entries(consumptionScopes)){
    if(Object.hasOwn(ledger,key))validateConsumptionMonths(ledger[key],scope);
  }
  for(const receipt of ledger.incomeReceipts){
    for(const allocation of receiptAllocations(receipt)){
      if(Object.hasOwn(allocation,'pocketDate')&&allocation.pocketDate!==null&&!validDate(allocation.pocketDate)){
        throw Error('荷包存入日期无效。');
      }
    }
  }
  if(!Object.hasOwn(ledger,'pocketTransfers'))return;
  if(!Array.isArray(ledger.pocketTransfers))throw Error('日常和荷包的划转格式无效。');
  const ids=new Set();
  for(const transfer of ledger.pocketTransfers){
    if(!consumptionObject(transfer)||typeof transfer.id!=='string'||!transfer.id.trim()||ids.has(transfer.id)||
      !validDate(transfer.date)||!['daily','pocket'].includes(transfer.to)||
      !validConsumptionAmount(transfer.amount)||transfer.amount===0){
      throw Error('日常和荷包的划转编号、方向、日期或金额无效。');
    }
    ids.add(transfer.id);
  }
}

function consumptionBalanceTotal(balances,scope){
  if(scope==='daily'&&hasManualConsumptionTotal(balances))return balances.total===null?null:cents(balances.total);
  const {accounts}=consumptionScopes[scope];
  if(!balances||accounts.some(([key])=>balances[key]==null))return null;
  return accounts.reduce((total,[key])=>total+cents(balances[key]),0);
}

function previousConsumptionMonth(m){
  const [year,index]=m.split('-').map(Number);
  return index>1?m.slice(0,5)+String(index-1).padStart(2,'0'):String(year-1).padStart(4,'0')+'-12';
}

function consumptionRecord(m,ledger,scope){
  return (ledger[consumptionScopes[scope].key]||[]).find(record=>record.month===m);
}

function consumptionOpening(m,record,ledger,scope){
  if(record.opening)return {balances:record.opening,carried:false};
  const previous=previousConsumptionMonth(m),end=consumptionRecord(previous,ledger,scope)?.end;
  if(end&&end.date===monthEnd(previous)&&consumptionBalanceTotal(end.balances,scope)!==null){
    return {balances:end.balances,carried:true};
  }
  return {balances:null,carried:false};
}

function consumptionAllocationMatches(allocation){
  return allocation.kind==='expense'&&consumptionAllocationNames.has(String(allocation.name).trim());
}

function pocketAllocationMatches(allocation){
  return allocation.kind==='expense'&&pocketAllocationNames.has(String(allocation.name).trim());
}

function consumptionEvents(m,ledger,scope){
  const pocket=scope==='pocket',matches=pocket?pocketAllocationMatches:consumptionAllocationMatches;
  const events=[];
  for(const receipt of ledger.incomeReceipts){
    if(!receiptIsReceived(receipt)||(!pocket&&receipt.date.slice(0,7)!==m))continue;
    for(const allocation of receiptAllocations(receipt).filter(matches)){
      const date=pocket&&Object.hasOwn(allocation,'pocketDate')?allocation.pocketDate:receipt.date;
      if(date?.slice(0,7)===m)events.push({date,amount:cents(allocation.amount),kind:'income',source:receipt.name,note:receipt.note,attributionMonths:receipt.coveredMonths?.map(row=>row.month)});
    }
  }
  for(const transfer of ledger.pocketTransfers||[]){
    if(transfer.date.slice(0,7)===m){
      events.push({date:transfer.date,amount:cents(transfer.amount),kind:transfer.to===scope?'transferIn':'transferOut',note:transfer.note});
    }
  }
  return events;
}

function consumptionEventTotals(events,from,through){
  const totals={income:0,transferIn:0,transferOut:0};
  for(const entry of events){
    if(entry.date>=from&&entry.date<=through)totals[entry.kind]+=entry.amount;
  }
  return totals;
}

function consumptionThroughEnd(record,field){
  const {mid,end}=record;
  if(!end)return 0;
  return cents(end[field]??0)+(end.sinceMid?cents(mid[field]??0):0);
}

function consumptionInterval(scope,events,startDate,startBalance,snapshot,manualOutgoing,extraIn){
  if(!snapshot||startBalance===null)return null;
  const balance=consumptionBalanceTotal(snapshot.balances,scope);
  if(balance===null)return null;
  const totals=consumptionEventTotals(events,startDate,snapshot.date);
  const funded=totals.income+totals.transferIn+extraIn,outgoing=manualOutgoing+totals.transferOut;
  const normalizedBalance=balance-(scope==='pocket'?snapshot.balances.accountTransferNet||0:0);
  const spent=startBalance+funded-normalizedBalance-(scope==='pocket'?outgoing:0);
  return {startDate,date:snapshot.date,funded,outgoing,balance,spent};
}

function consumptionMonthStats(m,ledger=data,scope='daily'){
  const record=consumptionRecord(m,ledger,scope)||{month:m},opening=consumptionOpening(m,record,ledger,scope);
  const {mid,end}=record,events=consumptionEvents(m,ledger,scope),firstDay=m+'-01',lastDay=monthEnd(m);
  const openingTotal=consumptionBalanceTotal(opening.balances,scope),midTotal=consumptionBalanceTotal(mid?.balances,scope);
  const endTotal=consumptionBalanceTotal(end?.balances,scope);
  const midOutgoing=cents(mid?.outgoing??0),midExtra=cents(mid?.extraIn??0);
  const endOutgoing=consumptionThroughEnd(record,'outgoing'),endExtra=consumptionThroughEnd(record,'extraIn');
  const normalize=(total,balances)=>total===null||scope!=='pocket'?total:total-(balances?.accountTransferNet||0);
  const start=normalize(openingTotal,opening.balances),middle=normalize(midTotal,mid?.balances);
  const first=consumptionInterval(scope,events,firstDay,start,mid,midOutgoing,midExtra);
  const second=mid&&end?consumptionInterval(scope,events,shiftDay(mid.date,1),middle,end,endOutgoing-midOutgoing,endExtra-midExtra):null;
  const throughEnd=consumptionInterval(scope,events,firstDay,start,end,endOutgoing,endExtra);
  const monthEndRecorded=end?.date===lastDay;
  const flow=consumptionEventTotals(events,firstDay,lastDay);
  const extra=end?endExtra:midExtra;
  return {
    month:m,record,opening,openingTotal,midTotal,endTotal,first,second,flow,extra,
    full:monthEndRecorded?throughEnd:null,
    latest:throughEnd||first,
    latestBalance:endTotal!==null?{date:end.date,amount:endTotal}:midTotal!==null?{date:mid.date,amount:midTotal}:null,
    closingBalance:monthEndRecorded?endTotal:null,
    funded:flow.income+flow.transferIn+extra
  };
}

function consumptionYearStats(year,ledger=data,scope='daily'){
  let previous=consumptionMonthStats(previousConsumptionMonth(year+'-01'),ledger,scope);
  const rows=months(year+'-01',12).map(m=>{
    const current=consumptionMonthStats(m,ledger,scope);
    const change=current.full&&previous.full?current.full.spent-previous.full.spent:null;
    previous=current;
    return {...current,change};
  });
  const closed=rows.filter(row=>row.full);
  const spent=closed.reduce((total,row)=>total+row.full.spent,0);
  return {
    rows,closed:closed.length,spent:closed.length?spent:null,
    average:closed.length?Math.round(spent/closed.length):null,
    funded:rows.reduce((total,row)=>total+row.funded,0)
  };
}

function consumptionTrend(rows,mode){
  const spending=mode==='spent',label=spending?'每月花费':'月末余额';
  const series=rows.map(row=>({
    value:spending?(row.latest?.spent??null):row.closingBalance,
    closed:!!row.full,
    hint:`${Number(row.month.slice(5))} 月${spending&&row.latest&&!row.full?' · 截至 '+row.latest.date.slice(5):''}`
  }));
  return annualMoneyTrend(series,label,spending,'录入盘点后显示'+label);
}

function monthlyMoneyTrend(series,label,spending,emptyText){
  const left=58,right=493,top=19,bottom=241,width=510,height=273,slot=(right-left)/12;
  const points=series.map((point,index)=>({...point,x:left+(index+.5)*slot}));
  const values=points.filter(point=>point.value!==null).map(point=>point.value/100);
  const low=Math.min(0,...values),high=Math.max(0,...values);
  const step=niceChartStep((high-low||100)/4),min=Math.floor(low/step)*step;
  const max=Math.max(min+step,Math.ceil((high||(!values.length?100:0))/step)*step);
  const y=value=>bottom-(value-min)/(max-min)*(bottom-top);
  const tickCount=Math.round((max-min)/step)+1;
  const ticks=Array.from({length:tickCount},(_,i)=>{
    const value=min+i*step,pos=y(value);
    const text=value>=100000||value<=-100000?
      (value/10000).toLocaleString('zh-CN',{maximumFractionDigits:1})+'万':
      value.toLocaleString('zh-CN',{maximumFractionDigits:2});
    return `<line x1="${left}" x2="${right}" y1="${pos}" y2="${pos}" class="${value===0?'consumption-zero':'consumption-gridline'}"/>
      <text x="${left-11}" y="${pos+4}" text-anchor="end">${text}</text>`;
  }).join('');
  const monthLabels=points.map((point,i)=>`<text x="${point.x}" y="${bottom+23}" text-anchor="middle">${i+1}月</text>`).join('');
  const pointTitle=point=>`<title>${point.hint} · ${label} ${money(point.value/100)}</title>`;
  const marks=consumptionTrendMarks(points,y,spending,pointTitle);
  return `<div class="consumption-trend-scroll"><svg class="consumption-trend-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${label}趋势，单位元">
    ${ticks}${monthLabels}${marks}${values.length?'':`<text class="consumption-chart-empty" x="${(left+right)/2}" y="${(top+bottom)/2}" text-anchor="middle">${emptyText}</text>`}
  </svg></div>`;
}

function openConsumptionEditor(kind,showSpending=false,scope=consumptionScope){
  const pocket=scope==='pocket',{key}=consumptionScopes[scope];
  const m=selectedMonth(),last=monthEnd(m),record=consumptionRecord(m,data,scope)||{month:m};
  const isOpening=kind==='opening',isMid=kind==='mid',afterMid=kind==='end'&&!!record.mid;
  const spendingEnabled=!pocket&&!isOpening;
  const savedSpending=spendingEnabled?spendingSummaryFor(m,kind):null;
  const stored=record[kind],savedBalances=isOpening?consumptionOpening(m,record,data,scope).balances:stored?.balances;
  const balances=pocket&&savedBalances?.wallet!=null
    ?{...savedBalances,wallet:pocketInventoryBalance(savedBalances,data,isOpening?shiftDay(m+'-01',-1):stored.date)/100}
    :savedBalances;
  const minDate=afterMid?shiftDay(record.mid.date,1):m+'-01';
  const maxDate=isMid?shiftDay(record.end?.date||last,-1):last;
  if(!isOpening&&minDate>maxDate)return alert('请先调整月末盘点日期，为月中盘点留出时间。');
  const day=localDay();
  const defaultMid=day.startsWith(m)?day:m+'-15';
  const date=stored?.date||
    (savedSpending?.through>=minDate&&savedSpending.through<=maxDate?savedSpending.through:null)||(isMid?(defaultMid>maxDate?maxDate:defaultMid):last);
  const amountFor=field=>afterMid&&stored?
    (consumptionThroughEnd(record,field)-cents(record.mid[field]??0))/100:stored?.[field]??0;
  let snapshot=JSON.stringify(data);
  modal.classList.toggle('wide-dialog',spendingEnabled);
  formTitle.textContent=`${m} · ${pocket?'荷包':''}${isOpening?'月初余额':isMid?'月中盘点':'月末盘点'}`;
  document.getElementById('modalSubmit').textContent=spendingEnabled?'保存盘点':'保存';
  fields.innerHTML=`<p class="muted">${isOpening?'填写当月第一天开始前的余额。':'填写盘点日结束时的账户余额。'} 空白表示待录入，零余额请填 0。</p>
    ${isOpening?'':`<label>盘点日期<input id="consumeDate" type="date" min="${minDate}" max="${maxDate}" value="${date}" required></label>`}
    ${consumptionBalanceFields(scope,balances)}
    ${!isOpening&&pocket?`<div class="form-grid">
      <label>本段额外存入合计（元）<input id="consumeExtra" type="number" min="0" max="${consumptionMoneyLimit}" step="0.01" value="${amountFor('extraIn')}"></label>
      <label>本段非消费转出合计（元）<input id="consumeOutgoing" type="number" min="0" max="${consumptionMoneyLimit}" step="0.01" value="${amountFor('outgoing')}"></label>
      </div>
      <p class="consumption-note">填写 ${minDate} 至盘点日的合计。已登记的日常划转与账户互转会自动处理，请勿重复填写。额外存入可填额外补存或对方转入。</p>`:''}
    ${isOpening||isMid?'':'<p class="consumption-note">录入当月最后一天的余额后，该月可计入年度已结算统计。</p>'}`;
  let spendingEditor=null;
    if(spendingEnabled){
      fields.insertAdjacentHTML('beforeend',spendingEntryMarkup(showSpending));
      spendingEditor=mountSpendingEntry(m,kind,record,apply=>{
        ensureEditorFresh(snapshot);
        const next=structuredClone(data);
        apply(next);
        if(!commitFinance(next))return false;
        snapshot=JSON.stringify(data);
        return true;
      });
    }
    if(!pocket)refreshConsumptionPreview(scope);
  form.onsubmit=event=>{
    event.preventDefault();
    try{
      ensureEditorFresh(snapshot);
      const next=structuredClone(data);
      const updated=structuredClone(record);
      const newBalances=consumptionEditorBalances(scope);
      if(pocket&&newBalances.wallet!==null){
        const through=isOpening?shiftDay(m+'-01',-1):document.getElementById('consumeDate').value;
        const net=pocketTransferNet(data,through);
        if(net)newBalances.accountTransferNet=net;
      }
      if(isOpening){
        updated.opening=newBalances;
      }else{
        const newDate=document.getElementById('consumeDate').value;
        const newOutgoing=pocket?readMoney(document.getElementById('consumeOutgoing').value||'0'):amountFor('outgoing');
        if(!validDate(newDate)||newDate<minDate||newDate>maxDate)throw Error('请填写有效的盘点日期。');
        if(isMid&&updated.end?.sinceMid&&updated.mid.date!==newDate){
          updated.end.outgoing=consumptionThroughEnd(updated,'outgoing')/100;
          if(pocket)updated.end.extraIn=consumptionThroughEnd(updated,'extraIn')/100;
          updated.end.sinceMid=false;
        }
        updated[kind]={date:newDate,balances:newBalances,outgoing:newOutgoing};
        if(pocket)updated[kind].extraIn=readMoney(document.getElementById('consumeExtra').value||'0');
        if(kind==='end')updated.end.sinceMid=afterMid;
      }
      next[key]=(next[key]||[]).filter(row=>row.month!==m).concat(updated);
      const saveSpending=spendingEditor?.hasChanges();
        if(saveSpending)spendingEditor.apply(next);
        if(commitFinance(next)){
          modal.close();
          if(saveSpending)openSpendingSummary(kind);
        }
    }catch(error){alert(error.message);}
  };
  modal.showModal();
  if(showSpending&&spendingEnabled)document.getElementById('spendingEntry').scrollIntoView({block:'start'});
}

  const account=allocationAccount(row);

  const account=key==='targetAccount'?value:allocationAccount(row);
  if(key!=='targetAccount')row[key]=value;
  row.accountId=allocationKind(row)==='saving'?account:'';
  row.holdingAccountId=allocationKind(row)==='saving'?'':account;

function validateHoldingAccounts(ledger){
  const rows=[...ledger.budgets,...ledger.incomeReceipts.flatMap(receiptAllocations)];

function repaymentReservationEvents(ledger){
  const accounts=new Set(ledger.deposits.map(account=>account.id).filter(Boolean)),events=[];
  for(const receipt of ledger.incomeReceipts){
    if(!receiptIsReceived(receipt))continue;
    for(const allocation of receiptAllocations(receipt)){
      if(allocation.kind==='repayment'&&accounts.has(allocation.holdingAccountId)&&cents(allocation.amount)>0){
        events.push({kind:'earmark',date:receipt.date,accountId:allocation.holdingAccountId,amount:allocation.amount});
      }
    }
  }
  return events;
}

function isRepaymentOnlyAccount(account){
  if(typeof account.repaymentOnly==='boolean')return account.repaymentOnly;
  const imported=account.sourceBatch==='accounts-image-20261104'&&account.sourceRow===4;  const marked=['还款专用','还款专用账户'].includes(String(account.status??'').trim());
  return imported||marked;
}

function accountIncluded(account,date=localDay()){
  const history=account.savingsInclusion;
  if(!history)return !isRepaymentOnlyAccount(account);
  return history.changes.findLast(change=>change.date<=date)?.included??history.initial;
}

function updateAccountInclusion(old,record,included,date){
  const history=old.savingsInclusion||{initial:!isRepaymentOnlyAccount(old),changes:[]};
  if(!old.id){
    if(included!==!isRepaymentOnlyAccount(record))record.savingsInclusion={initial:included,changes:[]};
    return;
  }
  if(!old.savingsInclusion&&included===!isRepaymentOnlyAccount(old)&&included===!isRepaymentOnlyAccount(record))return;
  const earlier=history.changes.filter(change=>change.date<date);
  const previous=earlier.at(-1)?.included??history.initial;
  const changes=earlier.concat(included!==previous?[{date,included}]:[],history.changes.filter(change=>change.date>date));
  record.savingsInclusion={initial:history.initial,changes};
}

function validateAccountInclusion(account){
  if(!Object.hasOwn(account,'savingsInclusion'))return;
  const history=account.savingsInclusion;
  if(!consumptionObject(history)||typeof history.initial!=='boolean'||!Array.isArray(history.changes))
    throw Error('计入总存款的设置格式无效。');
  let last='';
  for(const change of history.changes){
    if(!consumptionObject(change)||!validDate(change.date)||change.date<=last||typeof change.included!=='boolean')
      throw Error('请核对计入总存款的生效日期。');
    last=change.date;
  }
}

function savingsSnapshot(ledger=data,through){
  const states=new Map(),accounts=new Map();
  for(const account of ledger.deposits){
    const known=account.amount!==null&&(!through||(account.balanceStartDate&&account.balanceStartDate<=through));
    const state={balance:known?cents(account.amount):null,reserved:0,repaymentOnly:isRepaymentOnlyAccount(account),included:accountIncluded(account,through)};
    states.set(account,state);
    if(account.id)accounts.set(account.id,state);
  }
  const transfers=new Map((ledger.transfers||[]).map(transfer=>[transfer.id,transfer]));
  const movements=(ledger.depositEntries||[]).filter(entry=>
    !entry.voided&&(entry.kind!=='transfer'||entry.direction===-1||
      transfers.get(entry.transferId)?.fromAccountId===pocketAccountId));
  const events=movements.concat(repaymentReservationEvents(ledger)).filter(event=>!through||event.date<=through);
  // Same-day credits and designations are available before processing outflows.
  const priority=event=>event.kind==='earmark'?1:event.direction===1?0:2;
  events.sort((a,b)=>a.date.localeCompare(b.date)||priority(a)-priority(b));
  for(const event of events){
    const account=accounts.get(event.accountId),amount=cents(event.amount);
    if(!account)continue;
    if(event.kind==='earmark'){
      account.reserved+=amount;
      continue;
    }
    if(account.balance===null)continue;
    if(event.kind==='debt-payment'){
      account.reserved=Math.max(0,account.reserved-amount);
    }
    if(event.kind==='transfer'&&event.direction===-1){
      const target=accounts.get(transfers.get(event.transferId)?.toAccountId);
      if(target&&target.balance!==null){
        const free=Math.max(0,account.balance-account.reserved);
        const movedReserve=Math.min(account.reserved,Math.max(0,account.balance),Math.max(0,amount-free));
        account.reserved-=movedReserve;
        target.reserved+=movedReserve;
        target.balance+=amount;
      }
    }
    account.balance+=event.direction*amount;
  }
  return states;
}

function accountNetSavings(state){
  if(state.balance===null)return null;
  return Math.max(0,state.balance-state.reserved);
}

function depositTotal(states=savingsSnapshot()){
  let total=0;
  for(const state of states.values()){
    if(!state.included)continue;
    const net=accountNetSavings(state);
    if(net!==null&&net>=10000)total+=net;
  }
  return total/100;
}

function depositTotalOn(date,ledger=data){
  return depositTotal(savingsSnapshot(ledger,date));
}

function savingsAccountBalanceCell(state){
  const balance=state.balance===null?'<span class="muted">未填写</span>':money(state.balance/100);
  const details=[];
  if(state.repaymentOnly)details.push('还款专用');
  if(!state.included)details.push('不计入总存款');
  if(state.reserved)details.push('预留 '+money(state.reserved/100));
  return balance+(details.length?'<small class="savings-reserve">'+details.join(' · ')+'</small>':'');
}

 for(const source of data.incomes){const {remaining}=planMonthStatus(source,m);if(remaining)events.push({date:dateInMonth(m,source.day),name:source.name+'（待收）',amount:remaining});}

 return events;
}
function monthlyIncomeProgress(m){

 return {expected:expectedCents/100,actual:actualCents/100,remaining:remainingCents/100};
}

  const account=ledger.deposits.find(x=>x.id===allocation.accountId);if(!account)throw Error('请选择有效的存款账户。');

function validCoveredMonth(monthKey){
  return validMonth(monthKey)&&!monthKey.startsWith('0000-');
}


function fixedReceiptMonthCents(receipt,monthKey){
  if(receipt.coveredMonths)return receipt.coveredMonths.find(row=>row.month===monthKey)?.amountCents??null;
  return receipt.date.startsWith(monthKey)?cents(receipt.amount):null;
}

function planMonthStatus(source,m=selectedMonth()){
  const rows=data.incomeReceipts.filter(receipt=>
    receipt.sourceId===source.id&&fixedReceiptMonthCents(receipt,m)!==null);
  const received=rows.filter(receiptIsReceived);
  const actualCents=received.reduce((sum,receipt)=>sum+fixedReceiptMonthCents(receipt,m),0);
  const remainingCents=Math.max(0,cents(source.amount)-actualCents);
  const complete=received.length>0&&(remainingCents===0||received.some(receipt=>receipt.settled));
  return {rows,actual:actualCents/100,received:complete,remaining:complete?0:remainingCents/100};
}







const quickReceiptNote='每月计划快捷确认；日期可在右侧修改。';

function isReplaceableQuickReceipt(ledger,receipt,monthKey,amountCents){
  return receipt.id&&receipt.quickPlanMonth===monthKey&&receipt.date.startsWith(monthKey)&&
    !receipt.coveredMonths&&receipt.note===quickReceiptNote&&cents(receipt.amount)===amountCents&&
    !Object.hasOwn(receipt,'incomeCountedCents')&&!receiptAllocations(receipt).length&&
    !ledger.depositEntries.some(entry=>entry.sourceReceiptId===receipt.id);
}

function resolveCoveredMonthOverlap(next,receipt,previous){
  if(!receipt.coveredMonths||!receiptIsReceived(receipt))return true;
  const source=next.incomes.find(row=>row.id===receipt.sourceId);
  if(!source)return true;
  const prior=previous.sourceId===receipt.sourceId&&receiptIsReceived(previous)?previous.coveredMonths||[]:[];
  const remove=new Map(),overlaps=[];
  for(const {month:monthKey,amountCents} of receipt.coveredMonths){
    if(prior.some(row=>row.month===monthKey&&row.amountCents===amountCents)&&previous.settled===receipt.settled)continue;
    const other=next.incomeReceipts.filter(row=>row.id!==receipt.id&&row.sourceId===receipt.sourceId&&
      receiptIsReceived(row)&&fixedReceiptMonthCents(row,monthKey)!==null);
    if(!other.length)continue;
    const overflows=rows=>rows.length&&(rows.some(row=>row.settled)||receipt.settled||
      rows.reduce((total,row)=>total+fixedReceiptMonthCents(row,monthKey),amountCents)>cents(source.amount));
    if(!overflows(other))continue;
    const quick=other.filter(row=>isReplaceableQuickReceipt(next,row,monthKey,amountCents));
    // One exact shortcut can be the duplicate. Multiple matches need a manual review.
    if(quick.length===1)remove.set(quick[0].id,quick[0]);
    const remaining=other.filter(row=>!remove.has(row.id));
    if(overflows(remaining))overlaps.push(monthKey+' · '+remaining.map(row=>row.date+' '+money(row.amount)).join('、'));
  }
  if(overlaps.length&&!confirm('以下应收月份已有其他到账，请核对是否为不同款项。确认保留已有记录并继续？\n\n'+overlaps.join('\n'))){
    return false;
  }
  if(!remove.size)return true;
  const details=[...remove.values()].map(row=>row.date+' · '+row.name+' · '+money(row.amount)).join('\n');
  if(!confirm('以下快捷登记可能与这笔合并到账重复。确认它们确为重复后，将撤回列出的快捷登记并保存这笔到账。\n\n'+details)){
    return false;
  }
  next.incomeReceipts=next.incomeReceipts.filter(row=>!remove.has(row.id));
  return true;
}


function fixedIncomeMonthAction(index,received,monthKey,state,confirmedSeparate){
  const source=data.incomes[index];
  const linked=state.rows.some(row=>row.coveredMonths);
  const candidates=received&&!confirmedSeparate&&!linked?data.incomeReceipts.filter(row=>
    row.sourceId===source.id&&!row.coveredMonths&&receiptIsReceived(row)&&row.date.slice(0,7)>monthKey&&
    cents(row.amount)>cents(source.amount)):[];
  if(!linked&&!candidates.length)return false;
  const rows=linked?state.rows:candidates;
  const snapshot=JSON.stringify(data);
  modal.classList.add('wide-dialog');
  formTitle.textContent=source.name+' · '+monthKey+' 到账';
  document.getElementById('modalSubmit').textContent=linked?'关闭':'本月是单独到账';
  const note=linked?'此月已关联到账记录。可打开原记录核对日期、金额与对应月份。':
    '后续月份有这个项目的大额到账。若其中包含本月，请打开原记录添加对应月份。';
  fields.innerHTML='<p class="muted">'+note+'</p>'+
    table(['实际到账日','项目','到账金额',linked?'本月对应金额':'状态','操作'],rows.map(receipt=>row([
      receipt.date,esc(receipt.name),money(receipt.amount),
      linked?money(fixedReceiptMonthCents(receipt,monthKey)/100)+(receiptIsReceived(receipt)?'':' · 待收'):'已收',
      `<button type="button" data-receipt="${esc(receipt.id)}" data-month="${monthKey}"
        onclick="openCoveredReceipt(this.dataset.receipt,this.dataset.month)">编辑原到账</button>`
    ])))+(linked&&state.remaining>0?
      `<button type="button" class="receipt-covered-add-remainder" data-source="${esc(source.id)}" data-month="${monthKey}"
        onclick="openFixedReceiptRemainder(this.dataset.source,this.dataset.month)">＋ 登记本月剩余到账</button>`:'');
  form.onsubmit=event=>{
    event.preventDefault();
    if(linked){modal.close();return;}
    try{
      ensureEditorFresh(snapshot);
      if(selectedMonth()!==monthKey)throw Error('月份已切换，请重新打开。');
      if(markPlanReceived(index,true,true)&&modal.open)modal.close();
    }catch(error){alert(error.message);}
  };
  modal.showModal();
  return true;
}

function openFixedReceiptRemainder(sourceId,monthKey){
  const source=data.incomes.find(row=>row.id===sourceId);
  if(!source||selectedMonth()!==monthKey)return alert('固定收入已更新，请重新打开。');
  const {remaining}=planMonthStatus(source,monthKey);

  modal.close();

function syncAllocationPresetDefaults(ledger,receipt){
 if(!receiptIsReceived(receipt))return;
 const sums=new Map();for(const row of receiptAllocations(receipt))if(row.planId)sums.set(row.planId,(sums.get(row.planId)||0)+cents(row.amount));
 for(const [key,total]of sums){const preset=ledger.budgets.find(x=>x.id===key);if(preset){preset.amount=total/100;preset.incomeId='';}}
}
function markPlanReceived(index,received,confirmedSeparate=false){
 const source=data.incomes[index];if(!source)return false;const m=selectedMonth(),state=planMonthStatus(source,m);
 if(received&&state.received||!received&&!state.rows.some(receiptIsReceived))return true;
 if(fixedIncomeMonthAction(index,received,m,state,confirmedSeparate))return false;
 const next=structuredClone(data),rows=next.incomeReceipts.filter(x=>x.sourceId===source.id&&!x.coveredMonths&&x.date.startsWith(m));
 try{
  if(!received){for(const row of rows){row.received=false;rebuildReceiptEntries(next,row);}}
  else{
   for(const row of rows.filter(x=>!receiptIsReceived(x))){
    row.received=true;
    if(receiptAllocations(row).some(x=>x.kind==='saving'&&Number(x.amount)>0&&!next.deposits.some(a=>a.id===x.accountId&&a.amount!==null))){const originalIndex=data.incomeReceipts.findIndex(x=>x.id===row.id);openReceiptEditor(originalIndex,{received:true});return false;}

const incomeExclusionMinimumCents=500000;

function validateIncomeCounting(ledger){
  for(const receipt of ledger.incomeReceipts){
    if(!Object.hasOwn(receipt,'incomeCountedCents'))continue;
    if(!Number.isSafeInteger(receipt.incomeCountedCents)||receipt.incomeCountedCents<0){
      throw Error('收入统计的计入金额无效。');
    }
  }
}

function receiptIncomeModes(amountCents,sourceId){
  return {full:true,partial:!sourceId&&amountCents>1,none:amountCents>=incomeExclusionMinimumCents};
}

function receiptIncomeMode(receipt){
  const gross=cents(receipt.amount),counted=receipt.incomeCountedCents;
  const modes=receiptIncomeModes(gross,receipt.sourceId);
  if(modes.none&&counted===0)return 'none';
  if(modes.partial&&counted>0&&counted<gross)return 'partial';
  return 'full';
}

function updateReceiptIncomeCounting(){
  const source=document.getElementById('receiptSource').value;
  const amount=document.getElementById('receiptAmount').value;
  const mode=document.getElementById('receiptCountMode');
  const partial=document.getElementById('receiptCountAmount');
  const preview=document.getElementById('receiptCountedPreview');
  const hint=document.getElementById('receiptCountingHint');
  const gross=cents(amount),modes=receiptIncomeModes(gross,source);
  for(const option of mode.options)option.disabled=!modes[option.value];
  const needsPartial=mode.value==='partial';
  document.getElementById('receiptCountAmountLabel').hidden=!needsPartial;
  partial.disabled=!needsPartial;
  partial.required=needsPartial;
  const partialCents=cents(partial.value);
  const validPartial=Number.isSafeInteger(partialCents)&&partialCents>0&&partialCents<gross&&partial.validity.valid;
  const pending=document.getElementById('receiptReceived').value==='false';
  const counted=mode.value==='none'?0:needsPartial?partialCents:gross;
  preview.textContent=pending?'到账后计入':
    amount===''||!modes[mode.value]||needsPartial&&!validPartial?'':`计入 ${money(counted/100)}`;
  hint.textContent=!modes[mode.value]?
    (needsPartial?'额外收入可部分计入，请核对收入来源和到账金额。':'单笔到账满 5,000 元可不计入，请核对到账金额。'):
    needsPartial?'填写小于到账金额的计入金额。用途仍按实际到账金额分配。':
    '额外收入可部分计入，单笔到账满 5,000 元可不计入。用途按实际到账金额分配。';

function saveReceiptIncomeCounting(receipt){
  const mode=document.getElementById('receiptCountMode').value,gross=cents(receipt.amount);
  const modes=receiptIncomeModes(gross,receipt.sourceId);
  if(mode==='full'){
    delete receipt.incomeCountedCents;
    return;
  }
  if(mode==='none'){
    if(!modes.none)throw Error('单笔到账满 5,000 元可不计入收入。');
    receipt.incomeCountedCents=0;
    return;
  }
  if(!modes.partial)throw Error('请选择额外收入并填写有效的到账金额。');
  const counted=cents(readMoney(document.getElementById('receiptCountAmount').value,false));
  if(!Number.isSafeInteger(counted)||counted>=gross)throw Error('计入金额须小于实际到账金额。');
  receipt.incomeCountedCents=counted;
}

function validateFixedReceiptMonths(ledger){
  for(const receipt of ledger.incomeReceipts){
    if(!Object.hasOwn(receipt,'coveredMonths'))continue;
    const rows=receipt.coveredMonths,gross=cents(receipt.amount);
    if(!Array.isArray(rows)||!rows.length)throw Error('收入归属月份格式无效。');
    const seen=new Set();
    let total=0;
    for(const row of rows){
      if(!row||!validCoveredMonth(row.month)||seen.has(row.month)||
        !Number.isSafeInteger(row.amountCents)||row.amountCents<0||
        row.amountCents===0&&(gross!==0||rows.length!==1)){
        throw Error('归属月份应有效且各不相同，金额须大于 0。');
      }
      if(Object.hasOwn(row,'countedCents')&&(!Number.isSafeInteger(row.countedCents)||
        row.countedCents<0||row.countedCents>row.amountCents)){
        throw Error('各月计入金额须在 0 和该月归属金额之间。');
      }
      seen.add(row.month);
      total+=row.amountCents;
    }
    if(!Number.isSafeInteger(total)||total>gross)throw Error('归属金额合计不能超过实际到账。');
  }
}

function proportionalIncomeCents(amounts,total){
  if(!Number.isSafeInteger(total)||total<0||amounts.some(amount=>!Number.isSafeInteger(amount)||amount<0)){
    return amounts.map(()=>0);
  }
  const gross=amounts.reduce((sum,amount)=>sum+amount,0);
  if(!Number.isSafeInteger(gross))return amounts.map(()=>0);
  if(!gross||!total)return amounts.map(()=>0);
  const divisor=BigInt(gross),counted=BigInt(total);
  const shares=amounts.map((amount,index)=>{
    const product=BigInt(amount)*counted;
    return {index,value:Number(product/divisor),remainder:product%divisor};
  });
  let rest=total-shares.reduce((sum,share)=>sum+share.value,0);
  const order=shares.slice().sort((a,b)=>a.remainder===b.remainder?a.index-b.index:a.remainder>b.remainder?-1:1);
  for(const share of order){
    if(rest<=0)break;
    share.value++;
    rest--;
  }
  return shares.map(share=>share.value);
}

function receiptIncomeParts(receipt){
  const gross=cents(receipt.amount),monthKey=receipt.date.slice(0,7);
  const parts=(receipt.coveredMonths||[{month:monthKey,amountCents:gross}]).map(row=>({...row}));
  const assigned=parts.reduce((sum,row)=>sum+row.amountCents,0);
  if(assigned<gross){
    const current=parts.find(row=>row.month===monthKey);
    if(current)current.amountCents+=gross-assigned;
    else parts.push({month:monthKey,amountCents:gross-assigned});
  }
  parts.sort((a,b)=>a.month.localeCompare(b.month));
  const mode=receiptIncomeMode(receipt);
  if(mode==='full')return parts.map(row=>({...row,countedCents:row.amountCents}));
  if(mode==='none')return parts.map(row=>({...row,countedCents:0}));
  const counted=receipt.incomeCountedCents;
  const custom=assigned===gross&&parts.every(row=>Number.isSafeInteger(row.countedCents))&&
    parts.reduce((sum,row)=>sum+row.countedCents,0)===counted;
  if(custom)return parts;
  const shares=proportionalIncomeCents(parts.map(row=>row.amountCents),counted);
  return parts.map((row,index)=>({...row,countedCents:shares[index]}));
}

function monthlyCountedIncome(m){
  const parts=data.incomeReceipts.filter(receiptIsReceived)
    .flatMap(receipt=>receiptIncomeParts(receipt).filter(row=>row.month===m));
  return parts.length?parts.reduce((sum,row)=>sum+row.countedCents,0):null;
}

function updateReceiptCoveredMonths(rebalance=false){
  const rows=attributionDraftRows(),split=rows.length>0;
  const partial=document.getElementById('receiptCountMode').value==='partial';
  const excluded=document.getElementById('receiptCountMode').value==='none';
  const gross=cents(document.getElementById('receiptAmount').value);
  const target=excluded?0:partial?cents(document.getElementById('receiptCountAmount').value):gross;
  const amounts=rows.map(row=>cents(row.querySelector('[data-covered-amount]').value));
  const assigned=amounts.reduce((sum,amount)=>sum+amount,0);
  const shares=partial&&rebalance?proportionalIncomeCents(amounts,target):[];
  document.getElementById('receiptAttributionSingleLabel').hidden=split;
  document.getElementById('receiptAttributionMonth').disabled=split;
  document.getElementById('receiptCoveredMonthsNote').textContent=split?rows.length+' 个月':'单月可直接选择归属月份';
  let countedTotal=0;
  rows.forEach((row,index)=>{
    const input=row.querySelector('[data-covered-counted]');
    row.querySelector('.receipt-month-counted').hidden=!partial;
    input.disabled=!partial;
    if(!partial||rebalance)input.value=((excluded?0:partial?shares[index]:amounts[index])/100).toFixed(2);
    countedTotal+=cents(input.value);
  });
  const label=document.getElementById('receiptCoveredTotal');
  label.textContent=split?`已归属 ${money(assigned/100)} / 到账 ${money(gross/100)}`+
    (partial?` · 已计入 ${money(countedTotal/100)} / ${money(target/100)}`:''):'';
  label.classList.toggle('negative',assigned!==gross||partial&&countedTotal!==target);
  document.getElementById('receiptSettledLabel').textContent=split?
    '归属月份均已结清（金额少于计划时可勾选）':'应收已结清（到账少于应收时可勾选）';

  let monthKey=used[0]||single.value||selectedMonth();
  while(used.includes(monthKey)){
    const [year,month]=monthKey.split('-').map(Number);
    monthKey=month===1?String(year-1).padStart(4,'0')+'-12':monthKey.slice(0,5)+String(month-1).padStart(2,'0');
  }
  const source=data.incomes.find(row=>row.id===document.getElementById('receiptSource').value);
  const assigned=attributionDraftRows().reduce((sum,row)=>sum+cents(row.querySelector('[data-covered-amount]').value),0);
  const gross=cents(document.getElementById('receiptAmount').value);
  const defaultAmount=source?.amount??(gross>assigned?(gross-assigned)/100:'');
  const container=document.getElementById('receiptCoveredRows');
  container.insertAdjacentHTML('beforeend',coveredMonthRow(validCoveredMonth(monthKey)?monthKey:'',defaultAmount));

function collectReceiptCoveredMonths(receipt){

  delete receipt.coveredMonths;
  const elements=attributionDraftRows(),gross=cents(receipt.amount);
  const partial=receiptIncomeMode(receipt)==='partial';
  if(!elements.length){
    const monthKey=document.getElementById('receiptAttributionMonth').value;
    if(!validCoveredMonth(monthKey))throw Error('请选择有效的收入归属月份。');
    if(monthKey!==receipt.date.slice(0,7)||previous){
      receipt.coveredMonths=[{month:monthKey,amountCents:gross}];
    }
  }else{
    receipt.coveredMonths=elements.map(row=>{
      const part={month:row.querySelector('[data-covered-month]').value,
        amountCents:cents(readMoney(row.querySelector('[data-covered-amount]').value,false))};
      if(partial)part.countedCents=cents(readMoney(row.querySelector('[data-covered-counted]').value));
      return part;
    }).sort((a,b)=>a.month.localeCompare(b.month));
  }
  validateFixedReceiptMonths({incomeReceipts:[receipt]});
  if(!receipt.coveredMonths)return;
  const assigned=receipt.coveredMonths.reduce((sum,row)=>sum+row.amountCents,0);
  if(assigned!==gross)throw Error('请把到账总额分配完，各月归属金额合计须等于实际到账。');
  if(elements.length&&partial&&receipt.coveredMonths.reduce((sum,row)=>sum+row.countedCents,0)!==receipt.incomeCountedCents){
    throw Error('各月计入金额合计须等于本笔选择计入的金额。');
  }
}

function monthEndOverviewPoints(through){
  const recorded=(data.consumptionMonths||[]).map(row=>row.month).filter(m=>m<=through).sort().reverse();
  const points=[];
  for(const m of recorded){
    const {full}=consumptionMonthStats(m);
    if(!full)continue;
    points.push({month:m,income:monthlyCountedIncome(m),spending:full.spent});
    if(points.length===8)break;
  }
  return points.reverse();
}

function overviewMonthEndPlot(points,width,height){
  const left=width<360?46:55,right=width-14,top=22,bottom=height-39;
  const slot=(right-left)/points.length;
  const gap=Math.min(8,slot*.16),barWidth=Math.min(36,(slot*.74-gap)/2);
  const values=points.flatMap(point=>[point.income,point.spending]).filter(value=>value!==null).map(value=>value/100);
  const low=Math.min(0,...values),high=Math.max(0,...values);
  const step=niceChartStep((high-low||100)/(height<220?3:4));
  const min=Math.floor(low/step)*step,max=Math.max(min+step,Math.ceil(high/step)*step);
  const y=value=>bottom-(value-min)/(max-min)*(bottom-top),zero=y(0);
  const tickCount=Math.round((max-min)/step)+1;
  const ticks=Array.from({length:tickCount},(_,i)=>{
    const value=(i-Math.round(-min/step))*step;
    return {value,y:y(value)};
  });
  const groups=points.map((point,i)=>({...point,x:left+slot*(i+.5)}));
  return {width,height,left,right,top,bottom,slot,gap,barWidth,ticks,zero,y,groups};
}

function overviewAxisAmount(amount){
  if(Math.abs(amount)>=10000)return (amount/10000).toLocaleString('zh-CN',{maximumFractionDigits:1})+'万';
  return amount.toLocaleString('zh-CN',{maximumFractionDigits:Math.abs(amount)<100?2:0});
}

function overviewMonthBars(group,plot){
  return ['income','spending'].map((series,index)=>{
    const x=group.x+(index-.5)*(plot.barWidth+plot.gap),value=group[series];
    if(value===null)return `<text x="${x}" y="${plot.zero-5}" text-anchor="middle" class="overview-axis-text">—</text>`;
    const h=value===0?0:Math.max(1,Math.abs(plot.y(value/100)-plot.zero));
    const y=value>=0?plot.zero-h:plot.zero;
    const bar=value===0?
      `<line x1="${x-plot.barWidth/2}" x2="${x+plot.barWidth/2}" y1="${plot.zero}" y2="${plot.zero}" class="overview-${series}-zero"/>`:
      `<rect x="${x-plot.barWidth/2}" y="${y}" width="${plot.barWidth}" height="${h}" rx="3" class="overview-${series}-bar"/>`;
    const label=plot.slot>=91?`<text x="${x}" y="${value>=0?y-6:y+h+13}" text-anchor="middle"
      class="overview-value-text">${overviewAxisAmount(value/100)}</text>`:'';
    return bar+label;
  }).join('');
}

function hydrateOverviewChart(){
  if(overviewObserver){
    overviewObserver.disconnect();
    overviewObserver=null;
  }
  overviewPlot=null;
  if(page!==0)return;
  const host=document.getElementById('overviewMonthEndHost');
  if(!host)return;
  const points=monthEndOverviewPoints(selectedMonth());
  if(!points.length){
    host.innerHTML=`<div class="overview-chart-empty">
      <div class="overview-empty-icon" aria-hidden="true"><i></i><i></i><i></i></div>
      <b>等待月末盘点</b>
      <p>填齐月初余额和月末最后一天的盘点后，即可查看当月收入与消费。</p>
      <button type="button" onclick="openOverviewConsumption()">查看消费盘点</button>
    </div>`;
    return;
  }
  const draw=()=>{
    const width=Math.max(280,Math.round(host.clientWidth||600)),height=Math.max(145,Math.round(host.clientHeight||250));
    overviewPlot=overviewMonthEndPlot(points,width,height);
    host.innerHTML=overviewMonthEndSvg(overviewPlot)+'<div id="overviewMonthTooltip" class="overview-tooltip" hidden></div>';
  };
  draw();
  if(typeof ResizeObserver!=='undefined'){
    overviewObserver=new ResizeObserver(draw);
    overviewObserver.observe(host);
  }
}

function trackOverviewMonth(event){
  if(!overviewPlot)return;
  const box=event.currentTarget.getBoundingClientRect();
  const x=(event.clientX-box.left)/box.width*overviewPlot.width;
  if(x<overviewPlot.left||x>overviewPlot.right)return hideOverviewMonth();
  showOverviewMonth(Math.min(overviewPlot.groups.length-1,Math.floor((x-overviewPlot.left)/overviewPlot.slot)));
}

function showOverviewMonth(index){
  const point=overviewPlot?.groups[index],tip=document.getElementById('overviewMonthTooltip');
  if(!point||!tip)return;
  const income=point.income===null?'暂无记录':money(point.income/100);
  tip.innerHTML=`<b>${point.month} · 已完成月末盘点</b>
    <div><span>归属收入</span><span>${income}</span></div>
    <div><span>日常消费</span><span>${money(point.spending/100)}</span></div>`;
  tip.hidden=false;
  tip.style.left=Math.max(0,Math.min(overviewPlot.width-tip.offsetWidth,point.x+9))+'px';
  tip.style.top=Math.max(0,overviewPlot.top-12)+'px';
}

function hideOverviewMonth(){
  const tip=document.getElementById('overviewMonthTooltip');
  if(tip)tip.hidden=true;

function compactFootnote(html){const start=html.lastIndexOf('<p class="muted">');if(start<0||!html.endsWith('</p>')||![0,1,3,4,5].includes(page))return html;pageHelpContent[page]=html.slice(start+17,-4);const note=({0:'收入按归属月份统计 · 消费以余额盘点为准',1:incomeView==='year'?'已到账收入按归属月份汇总':'收入按归属月统计 · 分配按实际到账处理',3:'账户扣款与还款记录关联，可核对流水',4:'按时间或金额查看补贴记录',5:depositSortMode?'排序模式 · Ctrl点击上移/下移可置顶/置底':'还款专用账户单列 · 单账户净额 ≥100 元'})[page];return html.slice(0,start)+`<div class="page-footer"><span>${esc(note)}</span><button type="button" onclick="openPageHelp(${page})">ⓘ 使用说明</button></div>`;}

function openRowMenu(event,kind,index){event.stopPropagation();const record=data[kind][index];if(!record)return;rowMenuContext={kind,id:record.id};rowMenuAnchor=event.currentTarget;const items=kind==='deposits'?[['incoming','加款'],['outgoing','取用'],['transfer','账户互转'],['edit','编辑账户'],['remove','删除账户']]:kind==='subsidies'?[['subsidyState',record.received?'改为待到账':'标记已到账'],['remove','删除补贴']]:[['payment',record.paymentAccountId?'修改关联扣款':'关联账户扣款'],['remove','删除还款']];showFloatingMenu(event,items.map(([action,text],i)=>`${kind==='deposits'&&i===3?'<div class="menu-divider" role="separator"></div>':''}<button type="button" role="menuitem" onclick="rowMenuAction('${action}')" class="${action==='remove'?'danger-button':''}">${text}</button>`).join(''));}
function openHeaderMenu(event){event.stopPropagation();rowMenuContext={kind:'header'};rowMenuAnchor=event.currentTarget;showFloatingMenu(event,'<button type="button" role="menuitem" onclick="closeRowMenu();openDisplayNames()">界面名称</button><button type="button" role="menuitem" onclick="closeRowMenu();backup()">导出账本备份</button>');}
function showFloatingMenu(event,html){const menu=document.getElementById('actionMenu');menu.innerHTML=html;menu.hidden=false;const r=event.currentTarget.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(window.innerWidth-188,r.right-180))+'px';menu.style.top=Math.max(8,Math.min(window.innerHeight-menu.offsetHeight-8,r.bottom+5))+'px';menu.querySelector('button')?.focus();}
function closeRowMenu(focus=false){const menu=document.getElementById('actionMenu');if(menu)menu.hidden=true;if(focus&&rowMenuAnchor?.isConnected)rowMenuAnchor.focus();rowMenuContext=null;}
function rowMenuAction(action){const context=rowMenuContext;closeRowMenu();if(!context||!data[context.kind])return;const index=data[context.kind].findIndex(x=>x.id===context.id);if(index<0)return alert('记录已更新，请重新打开。');if(action==='incoming')openAccountMovement(index,1);else if(action==='outgoing')openAccountMovement(index,-1);else if(action==='entries')showAccountEntries(index);else if(action==='edit')edit(context.kind,index);else if(action==='remove')remove(context.kind,index);else if(action==='transfer')openAccountTransfer('',context.id);else if(action==='payment')openDebtPayment(index);else if(action==='subsidyState'&&context.kind==='subsidies')toggleSubsidy(index);}
if(document.addEventListener){document.addEventListener('click',event=>{const menu=document.getElementById('actionMenu');if(menu&&!menu.hidden&&!menu.contains(event.target))closeRowMenu();});document.addEventListener('keydown',event=>{const menu=document.getElementById('actionMenu');if(!menu||menu.hidden)return;if(event.key==='Escape'){event.preventDefault();closeRowMenu(true);}else if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const items=[...menu.querySelectorAll('button')],i=items.indexOf(document.activeElement);items[(i+(event.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();}});document.addEventListener('scroll',()=>closeRowMenu(),true);window.addEventListener('resize',()=>closeRowMenu());}

let syncBusy=false,syncConflict=null,syncChanged=false;
window.syncReady=false;
function setSyncStatus(message){document.getElementById('syncBadge').textContent=message;const status=document.getElementById('settingsSyncStatus');if(status)status.textContent=message}
async function fitWindow(){try{if(window.NATIVE_SYNC){await nativeCall('/window/fit',{});return}window.resizeTo(1280,720)}catch(e){alert(e.message)}}
async function nativeCall(path,body){if(!window.NATIVE_SYNC)throw Error('请从桌面 EXE 启动软件，HTML 文件不提供云同步。');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),180000);try{let r=await fetch(NATIVE_SYNC.url+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+NATIVE_SYNC.token},body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal});if(!r.ok)throw Error('本机同步服务连接失败，请退出托盘程序后重新打开软件。');let result=await r.json();if(result.status==='error')throw Error(result.message);return result}catch(e){if(e.name==='AbortError')throw Error('同步超时，请检查网络后重试。');if(e instanceof TypeError)throw Error('未连接到本机同步服务。请从 EXE 启动；若浏览器询问本地网络权限，请允许访问。');throw e}finally{clearTimeout(timer)}}

async function loadSyncConfig(){const box=document.getElementById('autoSync');if(box)box.checked=localStorage.getItem('yuliang-auto-sync')==='true';try{let c=await nativeCall('/config');if(!document.getElementById('davServer'))return;document.getElementById('davServer').value=c.server||'https://dav.jianguoyun.com/dav/';document.getElementById('davUser').value=c.user||'';document.getElementById('davPassword').placeholder=c.hasPassword?'密码已加密保存，留空保持不变':'填写应用密码';window.syncReady=!!c.hasPassword}catch(e){const f=document.getElementById('davFeedback');if(f)f.textContent=e.message}}
function feedback(s){let e=document.getElementById('davFeedback');if(e)e.textContent=s}
async function saveSyncConfig(){try{let r=await nativeCall('/config',{server:document.getElementById('davServer').value,user:document.getElementById('davUser').value,password:document.getElementById('davPassword').value});document.getElementById('davPassword').value='';window.syncReady=true;setSyncStatus('已配置 · 尚未同步');feedback(r.message)}catch(e){feedback(e.message)}}
async function testSync(){feedback('正在测试已保存的配置…');try{let r=await nativeCall('/test',{});feedback(r.message)}catch(e){feedback(e.message)}}
async function disconnectSync(){if(!confirm('断开将删除本机保存的 WebDAV 配置，不删除本机账本或云端数据。是否继续？'))return;try{await nativeCall('/disconnect',{});window.syncReady=false;localStorage.setItem('yuliang-auto-sync','false');setSyncStatus('同步已断开');loadSyncConfig();feedback('已删除本机连接配置')}catch(e){feedback(e.message)}}
function closeSync(){syncBusy=false;syncConflict=null;document.getElementById('syncModal').close()}
function syncText(heading,message){document.getElementById('syncHeading').textContent=heading;document.getElementById('syncMessage').textContent=message;document.getElementById('syncActions').innerHTML=''}
async function syncNow(mode='',expected='',automatic=false){if(syncBusy&&!mode)return;if(!window.syncReady){if(!automatic){page=6;render();feedback('请先保存配置，再点击同步。')}return}if(automatic&&(document.querySelector('dialog[open]')||document.hidden))return;syncBusy=true;syncConflict=null;let needsUpload=false;let dlg=document.getElementById('syncModal');if(!dlg.open)dlg.showModal();syncText('正在同步','正在检查本机和云端版本，请稍候…');setSyncStatus('正在同步…');syncChanged=false;try{const stored=localStorage.getItem(KEY);if(stored)data=validateLedger(JSON.parse(stored));const local=JSON.stringify(data);let r=await nativeCall('/sync',{data:local,mode,expected});if(r.status==='conflict'){syncConflict=r;setSyncStatus('存在不同版本 · 需要选择');syncText('请选择保留的版本',r.message+(r.updated?' 云端更新时间：'+new Date(r.updated).toLocaleString():''));const actions=document.getElementById('syncActions');const add=(label,fn)=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.appendChild(b)};add('使用本机版本',()=>syncNow('local',r.revision));if(!r.missing)add('使用云端版本',()=>syncNow('cloud',r.revision));add('稍后处理',closeSync);return}if(r.data){if(syncChanged)throw Error('同步期间另一个窗口修改了数据，请重新同步。');let next=validateLedger(JSON.parse(r.data));const appliedJson=JSON.stringify(next);needsUpload=appliedJson!==r.data;localStorage.setItem(KEY,appliedJson);data=next;month.value=data.base;await nativeCall('/ack',{revision:r.revision,data:JSON.stringify(next),sourceData:r.data});render()}localStorage.setItem('yuliang-last-sync',new Date().toISOString());if(syncChanged){const latest=localStorage.getItem(KEY);if(latest){data=validateLedger(JSON.parse(latest));render()}setSyncStatus('其他窗口有更改 · 待同步')}else setSyncStatus('已同步 '+new Date().toLocaleTimeString());closeSync();feedback(r.message);if(needsUpload&&!syncChanged)setTimeout(()=>syncNow('','',automatic),0)}catch(e){setSyncStatus('同步未完成 · 可离线使用');syncText('同步未完成',e.message+' 本机记录仍然保留。');document.getElementById('syncActions').innerHTML='<button onclick="closeSync()">关闭</button>'}}
document.getElementById('syncModal').addEventListener('cancel',e=>{e.preventDefault();if(syncConflict)closeSync()});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){if(syncBusy){syncChanged=true;return}try{data=validateLedger(JSON.parse(e.newValue));render();setSyncStatus('其他窗口已更新 · 待同步')}catch{}}});
let lastAutoData='';setInterval(()=>{if(window.NATIVE_SYNC)nativeCall('/ping').catch(()=>{});const current=localStorage.getItem(KEY)||'';if(localStorage.getItem('yuliang-auto-sync')==='true'&&window.syncReady&&current!==lastAutoData&&!syncBusy){lastAutoData=current;syncNow('','',true)}},30000);setInterval(()=>{if(localStorage.getItem('yuliang-auto-sync')==='true')syncNow('','',true)},300000);
if(window.NATIVE_SYNC)nativeCall('/config').then(c=>{window.syncReady=!!c.hasPassword;setSyncStatus(c.hasPassword?'已配置 · 待同步':'尚未配置 WebDAV');if(c.hasPassword&&localStorage.getItem('yuliang-auto-sync')==='true')syncNow('','',true)}).catch(e=>setSyncStatus('同步服务未连接'));
